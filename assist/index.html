<script>
(function(){var t=null;try{t=localStorage.getItem("assist.theme")}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();
window.MTT_BUILD="2026-11-26 16:10";
(function(){
  function check(){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.v||j.v===window.MTT_BUILD||window.MTT_BUILD.indexOf('__')===0||document.getElementById('updbar'))return;
    var b=document.createElement('button');b.id='updbar';b.textContent='新しい版があります。タップして更新';
    b.style.cssText='position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:#15161a;color:#fff;font:700 13px -apple-system,sans-serif;border:1px solid #ffffff59;border-radius:99px;padding:10px 18px;box-shadow:0 8px 24px #0006;white-space:nowrap';
    b.onclick=function(){location.replace(location.pathname+'?v='+encodeURIComponent(j.v))};document.body.appendChild(b);
  }).catch(function(){})}
  window.addEventListener('load',check);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script>
<style>
:root{
  /* concept: matte black / clear white. One ink colour does the work of an accent; colour appears only where it carries state
     (risk, confirmed, stack depth, suits). Tokens first, both themes below. layout: header / status strip / view / tabs */
  color-scheme:light;
  --bg:#f5f5f6; --surface:#ffffff; --raise:#f4f4f5; --raise2:#ebebed; --soft:#f0f0f2;
  --ink:#0b0b0c; --ink2:#33343a; --muted:#6b6d75; --faint:#a3a5ac; --line:#e2e2e6; --hair:#eeeef0; --seatline:#cdced3;
  --accent:#0b0b0c; --on-accent:#ffffff; --ring:#0b0b0c24;
  --felt1:#f4f4f5; --felt2:#dfdfe3; --rim:#0b0b0c; --felt-in:#ffffff; --ftxt:#0b0b0c; --ftxt2:#6b6d75;
  --danger:#c62f47; --warn:#b96a12; --ok:#0d7f55; --danger-bg:#fdecef; --warn-bg:#fdf0db; --ok-bg:#e1f5eb; --on-sem:#ffffff;
  --spade:#14161c; --heart:#d02b47; --diamond:#1a6fd8; --club:#12875a; --cardline:#cfd0d6;
  --tint-s:#eef0f4; --tint-h:#fdeef1; --tint-d:#e9f2fe; --tint-c:#e7f6ef; --fold:#e6e6ea;
  --scrim:#0b0c0f80; --shadow:0 1px 2px #0000000d,0 8px 24px #0000000f; --shadow-s:0 1px 3px #00000022;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --r:14px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09090a; --surface:#131314; --raise:#1b1b1d; --raise2:#232326; --soft:#1d1d20;
  --ink:#f4f4f5; --ink2:#d3d4d8; --muted:#9b9ca3; --faint:#66676e; --line:#29292d; --hair:#1f1f22; --seatline:#3a3a40;
  --accent:#f4f4f5; --on-accent:#09090a; --ring:#ffffff33;
  --felt1:#19191b; --felt2:#0e0e0f; --rim:#45454b; --felt-in:#111112; --ftxt:#f4f4f5; --ftxt2:#9b9ca3;
  --danger:#ff6f83; --warn:#f2aa4d; --ok:#44d394; --danger-bg:#3a151c; --warn-bg:#392a12; --ok-bg:#10301f; --on-sem:#09090a;
  --tint-s:#222226; --tint-h:#2e1a1e; --tint-d:#172231; --tint-c:#15281f; --fold:#28282c;
  --scrim:#000000b8; --shadow:none; --shadow-s:0 1px 3px #00000080;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea,select{font-size:16px;width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;color:var(--ink)}
textarea{resize:none;line-height:1.5;display:block}
select{font-size:15px;font-weight:700;padding:8px 6px;-webkit-appearance:menulist;appearance:auto}
input::placeholder,textarea::placeholder{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--ink);flex:none}
.logo img{border-radius:9px;display:block;border:1px solid var(--line)}
.logo b{font-weight:500;color:var(--muted)}
.seschip{margin-left:auto;min-width:0;min-height:38px;padding:4px 11px;border-radius:10px;background:var(--raise2);color:var(--ink);font-weight:700;font-size:12px;line-height:1.3;text-align:right;overflow:hidden}
.seschip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seschip small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);font-size:16px;color:var(--ink);display:grid;place-items:center}
.status{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}
.status .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.status div div{min-width:0;padding:0 2px;border-left:1px solid var(--hair);padding-left:9px}
.status div div:first-child{border-left:0;padding-left:2px}
.status small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.status b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b.d{color:var(--danger)}.status b.w{color:var(--warn)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px max(12px,env(safe-area-inset-right)) 18px max(12px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
nav{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{min-height:46px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
nav button.on{background:var(--accent);color:var(--on-accent)}

.bar{display:flex;align-items:center;gap:8px}
.bar .t{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t b{color:var(--ink);font-size:15px}
.mini{min-height:34px;padding:0 11px;border-radius:9px;background:var(--raise2);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;flex:none}
.mini.blue{background:transparent;border:1px solid var(--seatline);color:var(--ink)}
.mini.navy{background:var(--accent);color:var(--on-accent)}
.mini:disabled{opacity:.4}
.unit{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.unit button{min-width:38px;min-height:34px;font-size:12px;font-weight:800;color:var(--muted)}
.unit button.on{background:var(--accent);color:var(--on-accent)}

/* table */
.table{position:relative;height:320px;height:clamp(270px,calc(100dvh - 430px),330px);user-select:none;-webkit-user-select:none}
.felt{position:absolute;inset:26px 30px 28px;border-radius:999px;background:radial-gradient(ellipse at 50% 38%,var(--felt1),var(--felt2));border:1.5px solid var(--rim);box-shadow:inset 0 0 0 6px var(--felt-in),inset 0 0 0 7px var(--line),var(--shadow)}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;z-index:1;pointer-events:none}
.center .a{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--ftxt2)}
.center .b{font-size:21px;font-weight:800;color:var(--ftxt);letter-spacing:-.4px;line-height:1.15}
.center .c{font-size:11px;font-weight:600;color:var(--ftxt2)}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:2;width:64px;min-height:50px;padding:3px 3px 4px;border-radius:11px;background:var(--surface);border:1px solid var(--seatline);box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seat .pp{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.2px;display:flex;gap:3px;align-items:center}
.seat .nm{font-weight:800;font-size:11.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .st{font-size:10px;color:var(--muted);font-weight:700}
.seat .st.d,.li .r.d{color:var(--danger)}.seat .st.w,.li .r.w{color:var(--warn)}
.seat .dealer{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:8px;font-weight:800}
.seat.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seat.hero .pp,.seat.hero .st{color:var(--on-accent);opacity:.72}.seat.hero .dealer{background:var(--on-accent);color:var(--accent)}
.seat.empty{background:var(--surface);border:1px dashed var(--faint);box-shadow:none;color:var(--muted);font-size:18px;font-weight:500;opacity:.92}
.seat.sel{border-color:var(--ink);border-width:2px;box-shadow:0 0 0 4px var(--ring)}
.tc{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 4px;background:var(--raise2);color:var(--ink);letter-spacing:.2px}
.tc.agg{background:var(--danger-bg);color:var(--danger)}.tc.pas{background:var(--ok-bg);color:var(--ok)}
.seat .badge{position:absolute;top:-6px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);border:2px solid var(--surface);color:var(--on-accent);font-size:9.5px;font-weight:800;line-height:13px;text-align:center;padding:0 3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 span{font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted)}
.phead{display:flex;align-items:flex-start;gap:10px}
.phead .w{flex:1;min-width:0}
.pname{font-size:18px;font-weight:800;color:var(--ink);line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.psub{font-size:12px;color:var(--muted);font-weight:600}
.gist{margin-top:8px;padding:9px 11px;border-radius:4px 10px 10px 4px;background:var(--soft);border-left:3px solid var(--ink);font-weight:700;font-size:14px;line-height:1.5}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--raise2);color:var(--ink2)}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.cnt{position:relative;min-height:48px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:10.5px;font-weight:700;color:var(--ink2);padding:3px 2px}
.cnt b{font-size:17px;color:var(--ink);font-weight:800}
.cnt small{font-size:9.5px;color:var(--muted);font-weight:600}
.cnt:active{transform:scale(.96);background:var(--raise2)}
.cntrow{display:grid;grid-template-columns:34px 1fr;gap:3px}
.cntrow .dec{min-height:48px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:800;color:var(--muted);font-size:16px}
.cnts.edit{grid-template-columns:repeat(2,1fr)}
.qnote{display:flex;gap:6px;margin-top:10px}
.qnote input{flex:1}
.btn{min-height:46px;border-radius:12px;font-weight:800;font-size:15px;padding:0 14px;background:var(--raise2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn.pri,.btn.navy{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--seatline)}
.btn.dangerous{background:var(--danger-bg);color:var(--danger)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled),.chip:active,.pk button:active:not(:disabled){transform:scale(.97)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.nt{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.5}
.nt:last-child{border-bottom:0}
.nt .m{flex:none;width:58px;font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.35;padding-top:3px}
.nt .x{flex:1;min-width:0;overflow-wrap:anywhere}
.nt .x i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink2);background:var(--raise2);border-radius:5px;padding:1px 5px;margin-right:5px}
.nt .del{flex:none;width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:15px}
.hint{color:var(--muted);font-size:12.5px}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--hair)}
.li:last-child{border-bottom:0}
.li .ps{flex:none;width:46px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.li .mid{flex:1;min-width:0}
.li .a{font-weight:800;font-size:14.5px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.li .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b.g{color:var(--ink);font-weight:700}
.li .r{flex:none;font-size:12px;font-weight:800;color:var(--muted)}
.pill{flex:none;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:var(--ok-bg);color:var(--ok)}

.seg{display:flex;gap:5px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 11px;border-radius:10px;background:var(--raise);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lab{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:16px 0 6px}
.lab:first-of-type{margin-top:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{position:relative;display:block}
.inl span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--muted);pointer-events:none}
.inl input{padding-right:38px;font-weight:700}
.ngrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.ngrid .chip{padding:0;min-height:42px;font-size:15px}
.stkrow{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;margin-top:7px}
.stkrow .who{font-weight:800;font-size:13px;line-height:1.2;min-width:0;overflow:hidden}
.stkrow .who small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stkrow .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ICM */
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.8px;line-height:1.1}
.big span{font-size:12px;color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.tbl th{font-size:10.5px;font-weight:800;color:var(--muted);text-align:right;padding:4px 4px;line-height:1.35;vertical-align:bottom;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--hair);text-align:right;font-weight:700}
.tbl td:first-child{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.rp{display:inline-block;min-width:52px;border-radius:8px;padding:3px 7px;background:var(--raise2);color:var(--ink);font-weight:800;text-align:center}
.rp.mid{background:var(--warn-bg);color:var(--warn)}.rp.hi{background:var(--danger-bg);color:var(--danger)}
.need{list-style:none;margin:0;padding:0;font-size:13px;font-weight:600}
.need li{padding:5px 0;display:flex;gap:8px}
.need li::before{content:"□";color:var(--muted)}
.need li.done{color:var(--muted)}.need li.done::before{content:"✓";color:var(--ok)}
.out3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.out3 div{background:var(--raise);border-radius:10px;padding:9px 6px;text-align:center}
.out3 div.em{background:var(--accent);color:var(--on-accent)}
.out3 small{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.out3 .em small{color:var(--on-accent);opacity:.72}
.out3 b{font-size:19px;font-weight:800;letter-spacing:-.3px}
.fine{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.paysum{white-space:pre-line;background:var(--soft);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.6}
.paysum:empty{display:none}
.payrow{display:grid;grid-template-columns:56px 12px 56px 14px 1fr 34px;gap:5px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700}
.payrow>input{padding:10px 6px;text-align:center;font-weight:700}
.payrow .inl input{padding-right:62px}
.del{flex:none;width:34px;height:36px;border-radius:9px;color:var(--faint);font-size:17px}

/* tells & leaks */
.sti{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;color:var(--on-sem);background:var(--warn)}
.sti.ok{background:var(--ok)}.sti.no{background:var(--faint)}
.kd{font-style:normal;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin-right:5px;background:var(--accent);color:var(--on-accent)}
.kd.leak{background:var(--danger-bg);color:var(--danger)}
.rd{padding:10px 0;border-bottom:1px solid var(--hair)}
.rd:last-child{border-bottom:0}
.rd .tx{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.rd.no .tx span{text-decoration:line-through;color:var(--muted)}
.rd .meta{font-size:10.5px;color:var(--muted);font-weight:700;margin:2px 0 6px 28px}
.rd .ctl{display:flex;gap:6px;align-items:center;margin-left:28px}
.stseg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stseg button{min-height:34px;padding:0 11px;font-size:12px;font-weight:800;color:var(--muted)}
.stseg button.on{background:var(--warn);color:var(--on-sem)}.stseg button.on.ok{background:var(--ok)}.stseg button.on.no{background:var(--muted)}
.rdp{display:flex;gap:7px;align-items:flex-start;margin-top:7px;font-size:14px;font-weight:700;line-height:1.45}

/* ranges */
.rsel{display:grid;gap:5px;margin-top:6px}
.rsel.k3{grid-template-columns:repeat(3,1fr)}.rsel.k6{grid-template-columns:repeat(6,1fr)}.rsel.k7{grid-template-columns:repeat(7,1fr)}.rsel.k8{grid-template-columns:repeat(8,1fr)}

const ses=()=>S.ses;
const seatOf=pid=>ses().seats.findIndex(s=>s.pid===pid);
for(const p of Object.values(S.players))if(!Array.isArray(p.reads))p.reads=[];
function newPlayer(){const id=uid();S.players[id]={id,name:'',look:'',gist:'',tags:[],cnt:{},seen:0,notes:[],hands:[],reads:[],created:Date.now(),updated:Date.now()};return S.players[id]}
function touchP(p){p.updated=Date.now();if(ses().name)p.lastName=ses().name;save()}

/* ---------- format ---------- */
const fc=x=>Math.round(x).toLocaleString('en-US');
function nb(x){const v=x/ses().bb;return String(v<10?Math.round(v*100)/100:Math.round(v*10)/10)}
const fb=x=>x==null?'—':(ui.unit==='chips'||!(ses().bb>0)?fc(x):nb(x)+'BB');
const trimNum=v=>String(Math.round(v*100)/100);
const fm=x=>x>=1e8?trimNum(x/1e8)+'億':x>=1e4?trimNum(x/1e4)+'万':fc(x);
const ctext=c=>c?c[0]+SUIT[c[1]]:'?';
function pc(c,cls=''){return c?`<span class="pc ${cls} s-${c[1]}"><b>${c[0]}</b><i>${SUIT[c[1]]}</i></span>`:`<span class="pc ${cls} empty">＋</span>`}
function tm(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function typeCode(p){const t=p.tags.includes('タイト')?'T':p.tags.includes('ルース')?'L':'',a=p.tags.includes('アグレッシブ')?'A':p.tags.includes('パッシブ')?'P':'';
  if(!t&&!a)return '';const code=t&&a?(a==='A'?t+'AG':t+'P'):(t||a);return `<span class="tc ${a==='A'?'agg':a==='P'?'pas':''}">${code}</span>`}
const dname=(p,i)=>p.name||p.look||(i>0?'席'+(i+1):'名前なし');

/* ---------- positions ---------- */
function occSeats(){const o=[];ses().seats.forEach((s,i)=>{if(i===0||s.pid)o.push(i)});return o}
function positions(){
  const occ=occSeats(),m=occ.length,out={};if(m<2)return out;
  let bi=occ.findIndex(i=>i>=ses().btn);if(bi<0)bi=0;
  for(let k=0;k<m;k++)out[occ[(bi+k)%m]]=m===2?(k===0?'SB/BTN':'BB'):POS[m][(k+m-3)%m];
  return out;
}
function btnSeat(){const occ=occSeats();let bi=occ.findIndex(i=>i>=ses().btn);return occ[bi<0?0:bi]}
function nextHand(){
  const occ=occSeats();if(occ.length<2)return toast('プレイヤーを席に座らせてください');
  const bi=occ.indexOf(btnSeat());ses().btn=occ[(bi+1)%occ.length];
  for(const s of ses().seats)if(s.pid&&S.players[s.pid])S.players[s.pid].seen=(S.players[s.pid].seen||0)+1;
  save();render();
}

/* ---------- render ---------- */
function render(){
  const ed=ui.tab==='log'&&HL.editing(),pl=ui.tab==='table';
  for(const t of ['table','log','icm','range'])$('tb-'+t).classList.toggle('on',ui.tab===t);
  $('vSub').hidden=!pl;$('vTable').hidden=!(pl&&ui.pv==='table');$('vRoster').hidden=!(pl&&ui.pv==='roster');
  $('vLog').hidden=ui.tab!=='log';$('vIcm').hidden=ui.tab!=='icm';$('vRange').hidden=ui.tab!=='range';
  $('pv-table').classList.toggle('on',ui.pv==='table');$('pv-roster').classList.toggle('on',ui.pv==='roster');
  document.body.classList.toggle('editing',ed);$('nav').hidden=ed;$('hl-dock').hidden=!ed; // while a hand is being entered, the action buttons take the place of the tabs
  const s=ses(),p=s.pay;
  $('seschip').innerHTML=`<span>${esc([s.level,fc(s.sb)+'/'+fc(s.bb)].filter(Boolean).join(' ・ '))}</span><small>${esc([s.name||'大会の設定',p.left?'残り'+fc(p.left)+'人':''].filter(Boolean).join(' ・ '))}</small>`;
  renderStatus();if(ed)$('status').hidden=true;
  if(pl){if(ui.pv==='table')renderTable();else renderRoster()}else if(ui.tab==='log')HL.render();else if(ui.tab==='icm')renderIcm();else renderRange();
}
const band=x=>x==null||!(ses().bb>0)?'':x/ses().bb<=12?'d':x/ses().bb<=25?'w':'';
function renderStatus(){
  const s=ses(),H=s.seats[0].stack,o=payInfo(),p=s.pay,c=[];
  if(H!=null)c.push(`<div><small>スタック</small><b class="${band(H)}">${s.bb?nb(H)+'BB':fc(H)}</b></div>`);
  if(H!=null&&s.avg>0)c.push(`<div><small>アベレージ比</small><b>${(H/s.avg).toFixed(2)}倍</b></div>`);
  if(p.left)c.push(`<div><small>残り${o.itm?' / ITM':''}</small><b>${fc(p.left)}${o.itm?' / '+fc(o.itm):''}</b></div>`);
  if(o.bubble)c.push(`<div><small>バブルまで</small><b>あと${o.bubble}人</b></div>`);
  else if(o.next)c.push(`<div><small>次の賞金 ${fm(o.next.amt)}</small><b>あと${o.next.need}人</b></div>`);
  $('status').hidden=!c.length;$('statusIn').innerHTML=c.join('');
}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const m=$('themeColor');if(m)m.content=t==='dark'?'#131314':'#ffffff'}
applyTheme(document.documentElement.getAttribute('data-theme')||'light');
function seatXY(i){const n=ses().n,a=Math.PI/2+i*2*Math.PI/n;return [50+40.5*Math.cos(a),50+41.5*Math.sin(a)]}
function renderTable(){
  const s=ses(),pos=positions(),bs=btnSeat();
  const seats=s.seats.map((st,i)=>{
    const [x,y]=seatXY(i),d=i===bs&&pos[i]?'<span class="dealer">D</span>':'';
    if(i===0)return `<button class="seat hero ${ui.sel===0?'sel':''}" style="left:${x}%;top:${y}%" data-a="seat" data-i="0"><span class="pp">${pos[0]||''}${d}</span><span class="nm">Hero</span>${st.stack!=null?`<span class="st num ${ui.sel===0?'':''}">${fb(st.stack)}</span>`:''}</button>`;
    const p=st.pid&&S.players[st.pid];
    if(!p)return `<button class="seat empty" style="left:${x}%;top:${y}%" data-a="seat" data-i="${i}" aria-label="空席。プレイヤーを座らせる">＋</button>`;
    const nn=p.notes.length+p.hands.length+p.reads.filter(r=>r.st!=='no').length;
    return `<button class="seat ${ui.sel===i?'sel':''}" style="left:${x}%;top:${y}%" data-a="seat" data-i="${i}"><span class="pp">${pos[i]||''}${d}</span><span class="nm">${esc(dname(p,i))}</span><span class="st num ${band(st.stack)}">${st.stack!=null?fb(st.stack)+' ':''}${typeCode(p)}</span>${nn?`<span class="badge num">${nn}</span>`:''}</button>`;
  }).join('');
  const seated=s.seats.filter(x=>x.pid).length;
  let html=`<div class="bar"><div class="t">${pos[0]?`あなたは <b>${pos[0]}</b>`:'席をタップしてプレイヤーを登録'}</div><div class="unit" role="group" aria-label="表示単位"><button data-a="unit" data-u="chips" class="${ui.unit==='chips'?'on':''}">点</button><button data-a="unit" data-u="bb" class="${ui.unit==='bb'?'on':''}">BB</button></div><button class="mini" data-hl="mark" aria-label="今のハンドに印を付けて、あとでログに入力する">★ 印</button><button class="mini navy" data-a="next">次のハンド ▶</button></div>
  <div class="table"><div class="felt"></div><div class="center"><div class="a">${esc(s.level||'TABLE')}</div><div class="b num">${fc(s.sb)} / ${fc(s.bb)}</div><div class="c num">${s.ante?'Ante '+fc(s.ante)+' ・ ':''}${seated+1}人</div></div>${seats}</div>`;
  html+=panelHTML();
  const rows=s.seats.map((st,i)=>{const p=st.pid&&S.players[st.pid];if(!p)return '';
    return `<button class="li" data-a="seat" data-i="${i}"><span class="ps">${pos[i]||''}</span><span class="mid"><span class="a">${esc(dname(p,i))} ${typeCode(p)}</span><span class="b ${p.gist?'g':''}">${esc(p.gist||(liveReads(p)[0]?RKN[liveReads(p)[0].kind]+'（'+RST[liveReads(p)[0].st][0]+'）'+liveReads(p)[0].text:'')||p.tags.join(' ・ ')||(p.notes[0]?p.notes[0].text:'メモなし'))}</span></span><span class="r num ${band(st.stack)}">${st.stack!=null?fb(st.stack):''}</span></button>`}).join('');
  html+=`<section class="card"><h2>この卓のプレイヤー<span>${seated}人</span></h2>${rows||'<div class="hint">テーブルの「＋」の席をタップすると、プレイヤーを登録できます。</div>'}</section>`;
  $('vTable').innerHTML=html;
}
function cntCell(p,k,edit){
  const lab=k==='_seen'?'見たハンド':k,c=k==='_seen'?(p.seen||0):(p.cnt[k]||0),sub=PRE.includes(k)&&p.seen?`<small class="num">${c}/${p.seen}</small>`:'';
  const b=`<button class="cnt" data-a="cinc" data-k="${k}">${lab}<b class="num">${c}</b>${sub}</button>`;
  return edit?`<div class="cntrow"><button class="dec" data-a="cdec" data-k="${k}" aria-label="${lab} を1減らす">−</button>${b}</div>`:b;
}
function noteHTML(n,del){return `<div class="nt"><div class="m num">${tm(n.t)}${n.lvl?'<br>'+esc(n.lvl):''}</div><div class="x">${n.cat?`<i>${esc(n.cat)}</i>`:''}${esc(n.text)}</div>${del?`<button class="del" data-a="ndel" data-id="${n.id}" aria-label="このメモを削除">✕</button>`:''}</div>`}
function handHTML(x,del){return `<div class="nt"><div class="m num">${tm(x.t)}${x.lvl?'<br>'+esc(x.lvl):''}</div><div class="x"><span class="cards" style="display:inline-flex;vertical-align:middle;margin-right:6px">${x.cards.map(c=>pc(c,'sm')).join('')}</span>${x.pos?`<i>${esc(x.pos)}</i>`:''}${esc(x.line)}</div>${del?`<button class="del" data-a="hdel" data-id="${x.id}" aria-label="このハンドを削除">✕</button>`:''}</div>`}
const stIcon=st=>`<span class="sti ${st==='obs'?'':st}" title="${RST[st][0]}">${RST[st][1]}</span>`;
function liveReads(p){const o={ok:0,obs:1};return p.reads.filter(r=>r.st!=='no').sort((a,b)=>o[a.st]-o[b.st])}
function readHTML(r){return `<div class="rd ${r.st}"><div class="tx">${stIcon(r.st)}<span><i class="kd ${r.kind}">${RKN[r.kind]}</i>${esc(r.text)}</span></div>
  <div class="meta num">${tm(r.t)}${r.lvl?' ・ '+esc(r.lvl):''} ・ 見た回数 ${r.n||1}</div>

function panelHTML(){
  const i=ui.sel,s=ses();if(i==null)return '';
  if(i===0)return `<section class="card"><h2>Hero<span>自分のスタック</span></h2>${stackRow(0,'')}</section>`;
  const p=s.seats[i]&&s.seats[i].pid&&S.players[s.seats[i].pid];if(!p)return '';

  return `<section class="card" id="panel"><div class="phead"><div class="w"><div class="pname">${esc(dname(p,i))} ${typeCode(p)}</div><div class="psub">${[pos,p.name&&p.look?esc(p.look):'',s.seats[i].stack!=null?fb(s.seats[i].stack):''].filter(Boolean).join(' ・ ')}</div></div><button class="mini blue" data-a="detail" data-pid="${p.id}">詳細・編集</button></div>
  ${p.gist?`<div class="gist">${esc(p.gist)}</div>`:''}
  ${liveReads(p).map(r=>`<div class="rdp">${stIcon(r.st)}<span><i class="kd ${r.kind}">${RKN[r.kind]}</i>${esc(r.text)}</span></div>`).join('')}
  ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  <div class="cnts">${CNT.map(k=>cntCell(p,k)).join('')}</div>
  <div class="qnote"><input id="qn" placeholder="気になった動向をメモ" autocomplete="off" aria-label="メモを追加" enterkeyhint="done"><button class="btn pri" data-a="qadd" style="flex:none">追加</button></div>
  ${p.notes.slice(0,3).map(n=>noteHTML(n)).join('')}${p.hands.slice(0,2).map(x=>handHTML(x)).join('')}
  ${p.notes.length>3||p.hands.length>2?`<button class="mini" data-a="detail" data-pid="${p.id}" style="margin-top:6px">すべて見る（メモ${p.notes.length}・ハンド${p.hands.length}）</button>`:''}</section>`;
}
function stackRow(i,label){

}

function payRows(){return ses().pay.rows.filter(r=>r.from>=1&&r.amt!=null).map(r=>({from:r.from,to:Math.max(r.to||r.from,r.from),amt:r.amt})).sort((a,b)=>a.from-b.from)}
function payInfo(){

}
function payLines(){

  if(o.first!=null)a.push(`1位 ${fm(o.first)}`);

}
function parsePay(text){
  const rows=[];

    line=line.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，]/g,'').replace(/[¥￥$]/g,' ').replace(/(位|st|nd|rd|th)/gi,'$1 ');
    const m=line.match(/(\d{1,5})\s*(?:位|st|nd|rd|th)?\s*(?:[-‐–—~〜～]\s*(\d{1,5})\s*(?:位|st|nd|rd|th)?)?[\s:：.]+(\d+(?:\.\d+)?)\s*(億|万|k|m)?/i);
    if(!m)continue;let amt=parseFloat(m[3]);const u=(m[4]||'').toLowerCase();

    const from=+m[1],to=m[2]?+m[2]:from;if(from<1||to<from||!(amt>=0))continue;

/* ---------- ICM engine ---------- */
function payArray(n){const a=new Float64Array(n+2);for(const r of payRows())for(let k=r.from;k<=Math.min(r.to,n+1);k++)a[k]=r.amt;return a}
function popc(x){x=x-((x>>1)&0x55555555);x=(x&0x33333333)+((x>>2)&0x33333333);return(((x+(x>>4))&0x0f0f0f0f)*0x01010101)>>>24}
function icmExact(st,pay,n){ // hero is index 0; players with stack 0 are out (they take the lowest remaining places)
  if(!(st[0]>0))return pay[n];
  const s=[];for(let i=0;i<st.length;i++)if(st[i]>0)s.push(st[i]);
  const m=s.length,full=(1<<m)-1,memo=new Float64Array(1<<m).fill(-1),tot=new Float64Array(1<<m);
  for(let mask=1;mask<=full;mask++){const lb=mask&-mask;tot[mask]=tot[mask^lb]+s[31-Math.clz32(lb)]}
  const f=mask=>{if(memo[mask]>=0)return memo[mask];const k=m-popc(mask)+1,t=tot[mask];let ev=s[0]/t*pay[k];
    for(let i=1;i<m;i++)if(mask>>i&1)ev+=s[i]/t*f(mask^(1<<i));return memo[mask]=ev};
  return f(full);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function icmMC(st,pay,scen,seed=20261125){
  // Simulates the finishing order of everyone except Hero (shared across scenarios), then works out Hero's
  // chance of each place exactly for that order. Much steadier than simulating Hero as well.
  const n=st.length,N=Math.max(4000,Math.min(40000,Math.floor(4e6/n))),sum=new Float64Array(scen.length);
  let K=0;for(let k=1;k<=n;k++)if(pay[k]>0)K=k;
  const rnd=mulberry32(seed),base=new Float64Array(n),raw=new Float64Array(n),sorted=new Float64Array(n-1),m=n-1;
  for(let t=0;t<N;t++){
    for(let j=1;j<n;j++){const e=-Math.log(1-rnd());raw[j]=e;base[j]=e/st[j];sorted[j-1]=base[j]}
    sorted.sort();
    for(let q=0;q<scen.length;q++){
      const sc=scen[q],h=sc.h;if(!(h>0)){sum[q]+=pay[n];continue}
      const v=sc.v,old=v>0?base[v]:-1,nk=v>0&&sc.vs>0?raw[v]/sc.vs:Infinity;
      let i=0,skipped=!(v>0),usedNk=!(v>0),prev=1,ev=0;
      for(let k=1;k<=K;k++){
        if(!skipped&&i<m&&sorted[i]===old){i++;skipped=true}
        const cand=i<m?sorted[i]:Infinity;let tk;
        if(!usedNk&&nk<=cand){tk=nk;usedNk=true}else{tk=cand;i++}
        if(tk===Infinity){ev+=pay[k]*prev;prev=0;break}
        const e=Math.exp(-h*tk);ev+=pay[k]*(prev-e);prev=e;if(prev<1e-13)break;
      }

}
function icmEval(st,pay,scen){
  const n=st.length;
  if(n<=13)return {exact:true,ev:scen.map(sc=>{const a=st.slice();a[0]=Math.max(0,sc.h);if(sc.v>0)a[sc.v]=Math.max(0,sc.vs);return icmExact(a,pay,n)})};

}
function icmCompute(){
  const s=ses(),p=s.pay,rows=payRows(),H=s.seats[0].stack,n=p.left;
  const opp=[];s.seats.forEach((x,i)=>{if(i>0&&x.pid&&x.stack>0)opp.push({seat:i,stack:x.stack})});
  const need=[['賞金表を入力する',rows.length>0],['残り人数を入力する',n>1],['自分のスタックを入力する',H>0],['相手のスタックを1人以上入力する',opp.length>0]];
  if(need.some(x=>!x[1]))return {need};
  if(n>3000)return {err:'残り人数が多すぎます（3,000人まで）。'};
  if(opp.length+1>n)return {err:'残り人数が、スタックを入力した人数より少なくなっています。'};
  const unknown=n-1-opp.length,known=H+opp.reduce((a,x)=>a+x.stack,0);let rest=null,note='';
  if(unknown>0){
    if(s.avg>0){rest=(s.avg*n-known)/unknown;if(!(rest>0)){rest=null;note='アベレージと入力済みスタックが合わないため、'}}
    if(rest==null){rest=known/(opp.length+1);note+='他のプレイヤーは、入力済みスタックの平均と仮定しています。'}
    else note='スタック未入力の'+fc(unknown)+'人は、残りチップを均等に持つと仮定しています（1人 '+fb(rest)+'）。';
  }
  const st=new Float64Array(n);st[0]=H;opp.forEach((x,j)=>st[j+1]=x.stack);for(let j=opp.length+1;j<n;j++)st[j]=rest;
  const pay=payArray(n),scen=[{h:H,v:-1}];
  const D0=(s.sb||0)+(s.bb||0)+(s.ante||0);
  opp.forEach((x,j)=>{const E=Math.min(H,x.stack);scen.push({h:H+E,v:j+1,vs:x.stack-E},{h:H-E,v:j+1,vs:x.stack+E},{h:H,v:j+1,vs:x.stack+D0},{h:H+E+D0,v:j+1,vs:x.stack-E},{h:H-E,v:j+1,vs:x.stack+E+D0})});
  let spot=null;const sp=ui.spot,vj=opp.findIndex(x=>x.seat===sp.v);
  if(vj>=0&&sp.A>0){const V=opp[vj].stack,A=Math.min(sp.A,V,H),D=Math.max(0,sp.D||0),I=Math.min(Math.max(0,sp.I||0),A);
    spot={A,D,I,i0:scen.length,bust:A>=V};scen.push({h:H-I,v:vj+1,vs:V+D+I},{h:H+A+D,v:vj+1,vs:V-A},{h:H-A,v:vj+1,vs:V+A+D})}
  const r=icmEval(st,pay,scen),ev=r.ev,total=known+(unknown>0?rest*unknown:0);
  const out={exact:r.exact,note,ev0:ev[0],share:H/total,n,opps:opp.map((x,j)=>{const b=1+5*j,w=ev[b],l=ev[b+1],up=w-ev[0],dn=ev[0]-l,bf=up>1e-9?dn/up:null,E=Math.min(H,x.stack),cf=ev[b+2],cw=ev[b+3],cl=ev[b+4];return {seat:x.seat,stack:x.stack,bf,rp:bf==null?null:(bf/(1+bf)-.5)*100,win:w,lose:l,chip:E/(2*E+D0)*100,icm:cw-cl>1e-9?(cf-cl)/(cw-cl)*100:null}})};
  if(spot){const f=ev[spot.i0],w=ev[spot.i0+1],l=ev[spot.i0+2],C=spot.A-spot.I;out.spot={bust:spot.bust,chip:C/(2*spot.A+spot.D)*100,icm:w-l>1e-9?(f-l)/(w-l)*100:null,fold:f,win:w,lose:l,C,A:spot.A}}
  return out;
}

/* ================= equity: a hand against a range (all-in before the flop) ================= */
const EQ=(()=>{
  const rc=new Uint8Array(13),sm=new Uint16Array(4),sc=new Uint8Array(4);
  function strHigh(m){const x=(m<<1)|(m>>12&1);for(let t=13;t>=4;t--)if(((x>>(t-4))&31)===31)return t;return 0}
  // best five of seven; a bigger number is a better hand. card = rank*4+suit, rank 0 (deuce) .. 12 (ace)
  function ev7(c){
    rc.fill(0);sm.fill(0);sc.fill(0);let mask=0;
    for(let i=0;i<7;i++){const r=c[i]>>2,s=c[i]&3;rc[r]++;sm[s]|=1<<r;sc[s]++;mask|=1<<r}
    for(let s=0;s<4;s++)if(sc[s]>=5){const f=sm[s],sh=strHigh(f);if(sh)return 8<<20|sh;let v=0,n=0;for(let r=12;r>=0&&n<5;r--)if(f>>r&1){v=v<<4|r;n++}return 5<<20|v}
    let q=-1,t=-1,p1=-1,p2=-1;
    for(let r=12;r>=0;r--){const k=rc[r];if(k===4)q=r;else if(k===3){if(t<0)t=r;else if(p1<0)p1=r;else if(p2<0)p2=r}else if(k===2){if(p1<0)p1=r;else if(p2<0)p2=r}}
    if(q>=0){let k=12;while(k===q||!rc[k])k--;return 7<<20|q<<4|k}
    if(t>=0&&p1>=0)return 6<<20|t<<4|p1;
    const sh=strHigh(mask);if(sh)return 4<<20|sh;
    let v=0,n=0;
    if(t>=0){for(let r=12;r>=0&&n<2;r--)if(rc[r]&&r!==t){v=v<<4|r;n++}return 3<<20|t<<8|v}
    if(p2>=0){let k=12;while(k===p1||k===p2||!rc[k])k--;return 2<<20|p1<<8|p2<<4|k}
    if(p1>=0){for(let r=12;r>=0&&n<3;r--)if(rc[r]&&r!==p1){v=v<<4|r;n++}return 1<<20|p1<<12|v}
    for(let r=12;r>=0&&n<5;r--)if(rc[r]){v=v<<4|r;n++}return v;
  }
  const cid=c=>(12-RANKS.indexOf(c[0]))*4+'shdc'.indexOf(c[1]);
  // every two-card combination of a 13x13 grid cell (0 = AA, row<col suited, row>col offsuit)
  function cellCombos(idx){
    const i=Math.floor(idx/13),j=idx%13,a=12-Math.min(i,j),b=12-Math.max(i,j),out=[];
    if(i===j){for(let s=0;s<4;s++)for(let u=s+1;u<4;u++)out.push([a*4+s,a*4+u])}
    else if(i<j){for(let s=0;s<4;s++)out.push([a*4+s,b*4+s])}
    else for(let s=0;s<4;s++)for(let u=0;u<4;u++)if(s!==u)out.push([a*4+s,b*4+u]);
    return out;
  }
  // hero: two card strings. range: {gridIndex: percent}. Returns {eq (0-100), n, combos} or null

    switch(a){
      case 'new':if(await guardLeave('保存していない入力があります。新しいハンドを始めますか？'))start(fresh(false));break;
      case 'mark':bookmark();break;
      case 'tbl':useTable(d.s==='1');break;
      case 'resume':u.view='edit';render();break;
      case 'back':u.view='list';render();$('main').scrollTop=0;break;
      case 'open':{const x=hands.find(v=>v.id===d.id);if(!x)break;if(h&&h.id!==x.id&&!await guardLeave('保存していない入力があります。このハンドを開きますか？'))break;start(norm(clone(x)));break}
      case 'del':{if(!await ask('このハンドを削除しますか？元に戻せません。','削除'))break;hands=hands.filter(v=>v.id!==d.id);store();if(h&&h.id===d.id){h=null;dirty=false;LS.set('assist.hdraft',null)}renderList();break}
      case 'setup':openS('setup');break;
      case 'close':closeS();break;
      case 'seat':u.seat=d.p;openS('seat');break;
      case 'player':{closeS();ui.pid=d.pid;ui.hd={cards:['',''],pos:'',line:''};ui.cat='';openSheet('player');break}
      case 'hole':openPicker('Heroのカード',[['hole',0],['hole',1]],h.hole.every(Boolean)?+d.i:undefined);break;
      case 'board':{const i=+d.i,refs=boardRefs(i);openPicker(i<3?'Flop のカード':i===3?'Turn のカード':'River のカード',refs,refs.every(r=>getRef(r))&&i<3?i:undefined);break}
      case 'shown':openPicker(pname(d.p)+' のカード',[['shown',d.p,0],['shown',d.p,1]]);break;
      case 'slot':u.pk.i=+d.j;renderS();break;
      case 'card':pickCard(d.c);break;
      case 'pk-clear':{const r=u.pk.refs[u.pk.i];arrOf(r)[idxOf(r)]='';touch();renderS();break}
      case 'fold':doFold();break;
      case 'cc':doCheckCall();break;
      case 'allin':doAllin();break;
      case 'size':doBet(+d.to);break;
      case 'custom':u.custom=true;u.customAll=false;renderDock();E('amt').focus();break;
      case 'amt-x':u.custom=false;u.customAll=false;renderDock();break;
      case 'amt-ok':{const v=amtVal();if(v==null)return toast('金額を入力してください');if(u.customAll){const z=calc(),p=z.next,to=Math.round(v);push({p,t:to>z.high?(z.high>0?'R':'B'):'C',to,ai:true})}else doBet(v);break}
      case 'unit':{const v=amtVal();if(ui.unit===d.u)break;ui.unit=d.u;LS.set('assist.unit',ui.unit);rr();const i=E('amt');if(i){if(v!=null){i.value=ui.unit==='bb'?hnb(v):Math.round(v);amtHint()}i.focus()}break}
      case 'undo':undo();break;
      case 'next':nextStreet();break;
      case 'fold-hero':foldTo(h.hero);break;
      case 'fold-to':{const p=u.seat;closeS();foldTo(p);break}
      case 'result':h.result=h.result===d.r?'':d.r;touch();renderDock();renderSum();break;
      case 'share':openS('share');break;
      case 'copy':{const t=shareText();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(err){const ta=E('shareTa');ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e2){}}toast(ok?'コピーしました。LINEに貼り付けてください':'テキストを長押しでコピーしてください');break}
      case 'save':saveHand();break;
      case 'setn':{const n=+d.n;if(n===h.n)break;if(!await guardReset())break;const hs=h.stacks[h.hero];h.n=n;if(!P().includes(h.hero))h.hero=P().includes('BTN')?'BTN':'SB';h.stacks={};if(hs!=null)h.stacks[h.hero]=hs;h.profiles={};h.shown={};h.pids={};h.names={};h.tblOn=true;touch();keep();renderS();break}
      case 'sethero':{const p=d.p;if(p===h.hero)break;const a2=h.stacks[h.hero],b2=h.stacks[p];if(!h.actions.length){delete h.stacks[h.hero];delete h.stacks[p];if(a2!=null)h.stacks[p]=a2;if(b2!=null)h.stacks[h.hero]=b2}h.hero=p;touch();if(u.sheet==='seat')closeS();else renderS();break}
      case 'antetype':{if(d.k===h.anteType)break;if(!await guardReset())break;h.anteType=d.k;if(d.k!=='none'&&!h.ante)h.ante=h.bb;touch();keep();renderS();break}
      case 'tag':{const p=u.seat,pr=h.profiles[p]=h.profiles[p]||{tags:[],note:''};pr.tags=pr.tags.includes(d.t)?pr.tags.filter(t=>t!==d.t):[...pr.tags,d.t];touch();el.classList.toggle('on');break}
    }
  });
  document.addEventListener('input',e=>{
    const t=e.target;if(!t.closest('.hl'))return;
    if(t.id==='hl-q'){u.q=t.value;renderList();return}
    if(!h)return;
    if(t.dataset.note!=null){h.notes[+t.dataset.note]=t.value;h.stub=false;touch();grow(t)}
    else if(t.id==='hl-memo'){h.memo=t.value;touch();grow(t)}
    else if(t.id==='hl-tags'){h.tags=t.value;touch()}
    else if(t.id==='hl-amt')amtHint();
    else if(t.id==='hl-fName'){h.name=t.value;touch();keep()}
    else if(t.id==='hl-fLevel'){h.level=t.value;touch();keep()}
    else if(t.id==='hl-sNote'){const pr=h.profiles[u.seat]=h.profiles[u.seat]||{tags:[],note:''};pr.note=t.value;touch()}
    else if(t.id==='hl-sStack'||t.id==='hl-sStackBb'){const bbm=t.id==='hl-sStackBb',v=parseFloat(t.value);setStack(u.seat,isFinite(v)?(bbm?v*h.bb:v):null);const o=E(bbm?'sStack':'sStackBb');if(o)o.value=isFinite(v)?(bbm?Math.round(v*h.bb):hnb(v)):''}
    else if(t.dataset.hstk){const k=t.dataset.hstk,p=k==='hero'?h.hero:vilPos(),v=parseFloat(t.value),bbm=t.dataset.u==='bb';if(k==='vil')h.vil=p;setStack(p,isFinite(v)?(bbm?v*h.bb:v):null);
      const o=document.querySelector(`[data-hstk="${k}"][data-u="${bbm?'chips':'bb'}"]`);if(o)o.value=isFinite(v)?(bbm?Math.round(v*h.bb):hnb(v)):'';const z=calc();renderTable(z);renderDock(z);renderLog();updRem(z)}
  });
  document.addEventListener('change',async e=>{
    const t=e.target;if(!h||!t.closest('.hl'))return;
    if(t.id==='hl-kVil'){h.vil=t.value;touch();renderStk();return}
    if(t.id==='hl-sPid'){const p=u.seat,pl=S.players[t.value];for(const k of Object.keys(h.pids))if(k===p||h.pids[k]===t.value){delete h.pids[k];delete h.names[k]}if(pl){h.pids[p]=pl.id;h.names[p]=dname(pl,-1)}touch();renderS();return}
    const key={'hl-fSb':'sb','hl-fBb':'bb','hl-fAnte':'ante'}[t.id];if(!key)return;
    const v=Math.max(0,Math.round(parseFloat(t.value)||0));if(v===h[key])return;
    if(key==='bb'&&v<=0){t.value=h.bb;return toast('BBは1以上で入力してください')}
    if(!await guardReset()){t.value=h[key];return}
    if(key==='bb'){const old=h.bb;if(h.sb===Math.round(old/2))h.sb=Math.round(v/2);if(h.ante===old)h.ante=v}
    h[key]=v;touch();keep();renderS();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hl-amt'){e.preventDefault();document.querySelector('[data-hl="amt-ok"]').click()}if(e.key==='Escape'&&u.sheet)closeS()});
  return {sesChanged(){const c=LS.get('assist.hctx',null);if(c)LS.set('assist.hctx',{n:c.n})},render:rr,editing:()=>u.view==='edit'&&!!h,bookmark,count:()=>hands.length,imported,all:()=>hands,
    restore(a){hands=a.map(norm);store();h=null;dirty=false;u.view='list';LS.set('assist.hdraft',null)},
    withPlayer:pid=>hands.filter(x=>Object.values(x.pids||{}).includes(pid)),
    async open(id){const x=hands.find(v=>v.id===id);if(!x)return;if(h&&h.id!==x.id&&!await guardLeave('保存していない入力があります。このハンドを開きますか？'))return;ui.tab='log';start(norm(clone(x)))}};
})();

render();if(HL.imported)toast(`MTT LOGのハンド ${HL.imported}件を引き継ぎました`);
</script>
