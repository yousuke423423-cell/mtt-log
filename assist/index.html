<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MTT ASSIST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTT ASSIST">
<script>
window.MTT_BUILD="2026-11-26 13:01";
(function(){
  function check(){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.v||j.v===window.MTT_BUILD||window.MTT_BUILD.indexOf('__')===0||document.getElementById('updbar'))return;
    var b=document.createElement('button');b.id='updbar';b.textContent='新しい版があります。タップして更新';
    b.style.cssText='position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:#15161a;color:#fff;font:700 13px -apple-system,sans-serif;border:0;border-radius:99px;padding:10px 18px;box-shadow:0 8px 24px #0006;white-space:nowrap';
    b.onclick=function(){location.replace(location.pathname+'?v='+encodeURIComponent(j.v))};document.body.appendChild(b);
  }).catch(function(){})}
  window.addEventListener('load',check);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script>
<style>
:root{
  /* palette: red / white / black. --blue holds the red accent, --navy the black (names kept from the first version).
     layout: one-screen app. header / scrolling view / bottom tabs (卓・ICM・名簿) */
  color-scheme:light;
  --bg:#f4f4f5; --surface:#ffffff; --ink:#131417; --muted:#6c6f78; --line:#e2e3e7;
  --blue:#d7263d; --navy:#15161a; --soft:#fdeef0; --felt1:#3a3c44; --felt2:#16171b;
  --danger:#cf3550; --warn:#d9822b; --ok:#11895c;
  --spade:#16233b; --heart:#d02b47; --diamond:#1a6fd8; --club:#12875a;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,textarea,select{font-size:16px;width:100%;background:#f7f7f8;border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;color:var(--ink)}
textarea{resize:none;line-height:1.5;display:block}
select{font-size:15px;font-weight:700;padding:8px 6px;-webkit-appearance:menulist;appearance:auto}
input::placeholder,textarea::placeholder{color:#a6a8b0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--navy);flex:none}
.logo img{border-radius:10px;display:block}
.logo b{color:var(--blue)}
.seschip{min-width:0;min-height:38px;padding:4px 11px;border-radius:10px;background:#efeff1;color:var(--ink);font-weight:700;font-size:12px;line-height:1.3;text-align:right;overflow:hidden}
.seschip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seschip small{display:block;font-size:10.5px;color:#8b8e97;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px max(12px,env(safe-area-inset-right)) 18px max(12px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
nav{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{min-height:46px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
nav button.on{background:var(--navy);color:#fff}

.bar{display:flex;align-items:center;gap:8px}
.bar .t{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t b{color:var(--ink);font-size:15px}
.mini{min-height:34px;padding:0 11px;border-radius:9px;background:#efeff1;font-size:12px;font-weight:700;color:#3a3c43;white-space:nowrap;flex:none}
.mini.blue{background:var(--soft);color:var(--blue)}
.mini.navy{background:var(--navy);color:#fff}
.unit{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:#fff}
.unit button{min-width:38px;min-height:34px;font-size:12px;font-weight:800;color:var(--muted)}
.unit button.on{background:var(--navy);color:#fff}

/* table */
.table{position:relative;height:320px;height:clamp(280px,calc(100dvh - 380px),330px);user-select:none;-webkit-user-select:none}
.felt{position:absolute;inset:26px 30px 28px;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2));border:2px solid var(--blue);box-shadow:inset 0 0 0 7px #24252b,0 10px 24px #0000002e}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;z-index:1;pointer-events:none}
.center .a{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#ff8f9c}
.center .b{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.4px;line-height:1.15}
.center .c{font-size:11px;font-weight:600;color:#b5b7bf}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:2;width:64px;min-height:50px;padding:3px 3px 4px;border-radius:11px;background:var(--surface);border:1.5px solid #d0d1d7;box-shadow:0 2px 6px #0000001f;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seat .pp{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.2px;display:flex;gap:3px;align-items:center}
.seat .nm{font-weight:800;font-size:11.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .st{font-size:10px;color:var(--muted);font-weight:600}
.seat .dealer{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--navy);color:#fff;font-size:8px;font-weight:800}
.seat.hero{background:var(--blue);border-color:var(--blue);color:#fff}
.seat.hero .pp,.seat.hero .st{color:#ffe1e5}.seat.hero .dealer{background:#fff;color:var(--blue)}
.seat.empty{background:#ffffffe6;border:1.5px dashed #b9bbc3;box-shadow:none;color:var(--blue);font-size:18px;font-weight:700}
.seat.sel{border-color:var(--blue);border-width:2px;box-shadow:0 0 0 4px #d7263d38,0 2px 8px #d7263d40}
.tc{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 4px;background:#efeff1;color:var(--navy);letter-spacing:.2px}
.tc.agg{background:#fdecef;color:var(--danger)}.tc.pas{background:#e2f6ed;color:var(--ok)}
.seat .badge{position:absolute;top:-6px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--navy);border:2px solid #fff;color:#fff;font-size:9.5px;font-weight:800;line-height:13px;text-align:center;padding:0 3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 span{font-size:11px;font-weight:600;color:var(--muted)}
.phead{display:flex;align-items:flex-start;gap:10px}
.phead .w{flex:1;min-width:0}
.pname{font-size:17px;font-weight:800;color:var(--navy);line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.psub{font-size:12px;color:var(--muted);font-weight:600}
.gist{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff3f4;border:1px solid #f3c5cb;border-left:4px solid var(--blue);font-weight:700;font-size:13.5px;line-height:1.5}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:#efeff1;color:#3a3c43}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.cnt{position:relative;min-height:46px;border-radius:10px;background:#f2f2f4;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:10.5px;font-weight:700;color:#3a3c43;padding:3px 2px}
.cnt b{font-size:16px;color:var(--ink);font-weight:800}
.cnt small{font-size:9.5px;color:var(--muted);font-weight:600}
.cnt:active{transform:scale(.96);background:var(--soft)}
.cntrow{display:grid;grid-template-columns:34px 1fr;gap:3px}
.cntrow .dec{min-height:46px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:800;color:var(--muted);font-size:16px}
.cnts.edit{grid-template-columns:repeat(2,1fr)}
.qnote{display:flex;gap:6px;margin-top:10px}
.qnote input{flex:1}
.btn{min-height:46px;border-radius:12px;font-weight:800;font-size:15px;padding:0 14px;background:#efeff1;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 4px 12px #d7263d40}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.dangerous{background:#fdecef;color:var(--danger)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled),.chip:active,.pk button:active:not(:disabled){transform:scale(.97)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.nt{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #eeeef0;font-size:13.5px;line-height:1.5}
.nt:last-child{border-bottom:0}
.nt .m{flex:none;width:58px;font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.35;padding-top:2px}
.nt .x{flex:1;min-width:0;overflow-wrap:anywhere}
.nt .x i{font-style:normal;font-size:10.5px;font-weight:800;color:#3a3c43;background:#efeff1;border-radius:5px;padding:1px 5px;margin-right:5px}
.nt .del{flex:none;width:30px;height:30px;border-radius:8px;color:#a3a5ad;font-size:15px}
.hint{color:var(--muted);font-size:12.5px}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid #eeeef0}
.li:last-child{border-bottom:0}
.li .ps{flex:none;width:46px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.li .mid{flex:1;min-width:0}
.li .a{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.li .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b.g{color:#a81b2e;font-weight:700}
.li .r{flex:none;font-size:11px;font-weight:700;color:var(--muted)}
.pill{flex:none;font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;background:#e2f6ed;color:var(--ok)}

.seg{display:flex;gap:5px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 11px;border-radius:10px;background:#f2f2f4;border:1px solid var(--line);font-weight:700;font-size:12.5px;color:#3a3c43}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lab{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin:14px 0 6px}
.lab:first-of-type{margin-top:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{position:relative;display:block}
.inl span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--muted);pointer-events:none}
.inl input{padding-right:38px;font-weight:700}
.ngrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.ngrid .chip{padding:0;min-height:42px;font-size:15px}
.stkrow{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;margin-top:7px}
.stkrow .who{font-weight:800;font-size:13px;line-height:1.2;min-width:0;overflow:hidden}
.stkrow .who small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stkrow .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ICM */
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.6px}
.big span{font-size:12px;color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.tbl th{font-size:10.5px;font-weight:800;color:var(--muted);text-align:right;padding:4px 4px;line-height:1.35;vertical-align:bottom;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid #eeeef0;text-align:right;font-weight:700}
.tbl td:first-child{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.rp{display:inline-block;min-width:52px;border-radius:8px;padding:3px 7px;background:#efeff1;color:var(--ink);font-weight:800;text-align:center}
.rp.mid{background:#fff1dc;color:var(--warn)}.rp.hi{background:#fdecef;color:var(--danger)}
.need{list-style:none;margin:0;padding:0;font-size:13px;font-weight:600}
.need li{padding:5px 0;display:flex;gap:8px}
.need li::before{content:"□";color:var(--muted)}
.need li.done{color:var(--muted)}.need li.done::before{content:"✓";color:var(--ok)}
.out3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.out3 div{background:#f2f2f4;border-radius:10px;padding:8px 6px;text-align:center}
.out3 div.em{background:var(--navy);color:#fff}
.out3 small{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.out3 .em small{color:#e3e4e8}
.out3 b{font-size:18px;font-weight:800;letter-spacing:-.3px}
.fine{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.paysum{white-space:pre-line;background:#f2f2f4;border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--navy);line-height:1.6}
.paysum:empty{display:none}
.payrow{display:grid;grid-template-columns:56px 12px 56px 14px 1fr 34px;gap:5px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700}
.payrow>input{padding:10px 6px;text-align:center;font-weight:700}
.payrow .inl input{padding-right:62px}
.del{flex:none;width:34px;height:36px;border-radius:9px;color:#a3a5ad;font-size:17px}

/* tells & leaks */
.sti{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;background:#e0a01f}
.sti.ok{background:var(--ok)}.sti.no{background:#a9b5c9}
.kd{font-style:normal;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin-right:5px;background:#26272c;color:#fff}
.kd.leak{background:#fdecef;color:var(--danger)}
.rd{padding:9px 0;border-bottom:1px solid #eeeef0}
.rd:last-child{border-bottom:0}
.rd .tx{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.rd.no .tx span{text-decoration:line-through;color:var(--muted)}
.rd .meta{font-size:10.5px;color:var(--muted);font-weight:700;margin:2px 0 6px 28px}
.rd .ctl{display:flex;gap:6px;align-items:center;margin-left:28px}
.stseg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.stseg button{min-height:34px;padding:0 11px;font-size:12px;font-weight:800;color:var(--muted)}
.stseg button.on{background:#e0a01f;color:#fff}.stseg button.on.ok{background:var(--ok)}.stseg button.on.no{background:#8c9ab3}
.rdp{display:flex;gap:7px;align-items:flex-start;margin-top:7px;font-size:13.5px;font-weight:700;line-height:1.45}

/* ranges */
.rsel{display:grid;gap:5px;margin-top:6px}
.rsel.k3{grid-template-columns:repeat(3,1fr)}.rsel.k6{grid-template-columns:repeat(6,1fr)}.rsel.k7{grid-template-columns:repeat(7,1fr)}.rsel.k8{grid-template-columns:repeat(8,1fr)}
.rsel .chip{padding:0;min-height:38px;font-size:12px}
.rsel .chip:disabled{opacity:.3}
.rlab{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:9px}
.rgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:1.5px;background:#fff;border-radius:8px;overflow:hidden;margin-top:6px}
.rgrid button{aspect-ratio:1/1;font-size:9px;font-weight:800;letter-spacing:-.3px;color:#6c6f78;display:flex;align-items:center;justify-content:center;border-radius:2px}
.rgrid button.on{color:#fff;text-shadow:0 1px 1px #0005}
.rgrid button.cur{outline:2px solid var(--navy);outline-offset:-2px;z-index:1}
.rleg{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:12px;font-weight:700}
.rleg span{display:inline-flex;align-items:center;gap:5px}
.rleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rdet{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f2f2f4;font-size:13px;font-weight:700;min-height:36px}
.rtitle{font-size:15px;font-weight:800;color:var(--navy);line-height:1.35}

.rimg{display:block;width:100%;margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#111}
.rimg img{display:block;width:100%;height:auto;min-height:80px}
.viewer{position:fixed;inset:0;z-index:70;background:#000}
.vscroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;padding:calc(56px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom))}
.vscroll img{display:block;width:100%;height:auto;flex:none}
.vscroll.z img{width:230%}
.vclose,.vzoom{position:absolute;top:calc(10px + env(safe-area-inset-top));min-height:38px;padding:0 14px;border-radius:10px;background:#ffffffe6;color:#111;font-weight:800;font-size:13px}
.vclose{right:12px}.vzoom{left:12px}

/* sheets */
.scrim{position:fixed;inset:0;background:#0b0c0f80;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0b0c0f55}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:38px;height:4px;border-radius:2px;background:#d6d7dc;margin:0 auto 8px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.shead h3{margin:0;font-size:17px;font-weight:800;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .x{flex:none;min-height:36px;padding:0 12px;border-radius:10px;background:#efeff1;font-weight:700;font-size:13px;color:#3a3c43}
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:52px;border-radius:7px;background:#fff;border:1px solid #cfd0d6;box-shadow:0 1px 3px #0000001f;font-weight:800;line-height:1;gap:1px;flex:none}
.pc b{font-size:20px;font-weight:800}.pc i{font-style:normal;font-size:18px}
.pc.empty{background:#f7f7f8;border:1.5px dashed #b9bbc3;box-shadow:none;color:var(--blue);font-size:15px;font-weight:700}
.pc.sm{width:22px;height:30px;border-radius:4px}.pc.sm b{font-size:12px}.pc.sm i{font-size:11px}
.s-s{color:var(--spade)}.s-h{color:var(--heart)}.s-d{color:var(--diamond)}.s-c{color:var(--club)}
.cards{display:flex;gap:4px}
.slots{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.slots button.cur .pc{border:2px solid var(--blue);box-shadow:0 0 0 3px #d7263d2e}
.pk{display:flex;flex-direction:column;gap:7px}
.pkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:5px;border-radius:11px}
.pkrow.s-s{background:#eef1f6}.pkrow.s-h{background:#fdeef1}.pkrow.s-d{background:#e9f2fe}.pkrow.s-c{background:#e7f6ef}
.pk button{height:44px;border-radius:8px;background:#fff;border:1px solid #d3d4d9;box-shadow:0 1px 2px #00000014;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:1px;color:inherit}
.pk button i{font-style:normal;font-size:16px}
.pk button:disabled{opacity:.2;box-shadow:none}
.pk .suit{display:grid;place-items:center;font-size:24px}
.modal{position:fixed;inset:0;z-index:40;background:#0b0c0f8c;display:grid;place-items:center;padding:24px}
.modal .box{background:#fff;border-radius:18px;padding:18px;max-width:340px;width:100%;box-shadow:0 20px 60px #0b0c0f66}
.modal p{margin:0 0 14px;font-size:15px;font-weight:600;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:99px;box-shadow:0 8px 24px #0b0c0f66;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@media (max-height:690px){.pk button{height:38px;font-size:17px}.pk{gap:5px}.pkrow{padding:4px}}
@media (max-width:359px){.seat{width:56px}}
@media (min-width:520px){.table{height:370px}.felt{inset:30px 60px 34px}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="icon-180.png" alt="" width="34" height="34"><span>MTT<b>ASSIST</b></span></div>
  <button class="seschip" data-a="ses" id="seschip" aria-label="大会の設定を開く"></button>
</header>
<main id="main">
  <div class="wrap" id="vTable"></div>
  <div class="wrap" id="vIcm" hidden></div>
  <div class="wrap" id="vRange" hidden></div>
  <div class="wrap" id="vRoster" hidden></div>
</main>
<nav><div class="in"><button data-a="tab" data-t="table" id="tb-table">卓</button><button data-a="tab" data-t="icm" id="tb-icm">ICM</button><button data-a="tab" data-t="range" id="tb-range">レンジ</button><button data-a="tab" data-t="roster" id="tb-roster">名簿</button></div></nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="modal" hidden><div class="box"><p id="modalMsg"></p><div class="row"><button class="btn" data-a="modal-no">キャンセル</button><button class="btn pri" id="modalOk" data-a="modal-ok">OK</button></div></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="rimgIn" accept="image/*" hidden>
<input type="file" id="rimgMulti" accept="image/*" multiple hidden>
<div class="viewer" id="viewer" hidden><div class="vscroll" id="vscroll"><img id="vimg" alt=""></div><button class="vclose" data-a="vclose">閉じる</button><button class="vzoom" data-a="vzoom" id="vzoomBtn">拡大</button></div>

<script>
'use strict';
const POS={2:['SB','BB'],3:['BTN','SB','BB'],4:['CO','BTN','SB','BB'],5:['HJ','CO','BTN','SB','BB'],6:['UTG','HJ','CO','BTN','SB','BB'],7:['UTG','LJ','HJ','CO','BTN','SB','BB'],8:['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'],9:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB'],10:['UTG','UTG+1','UTG+2','MP','LJ','HJ','CO','BTN','SB','BB']};
const SUIT={s:'♠',h:'♥',d:'♦',c:'♣'},RANKS='AKQJT98765432';
const TAGS=['タイト','ルース','アグレッシブ','パッシブ','レギュラー','レクリエーショナル','3bet多め','コール多め','ブラフ多め','降りない','リンプ多め','スチール多め','CB多め','ティルト気味'];
const CNT=['オープン','リンプ','コール','3bet','3betに降り','CB','チェックレイズ','SD到達'],PRE=['オープン','リンプ','コール','3bet'];
const CATS=['プリフロップ','ポストフロップ','サイズ'];
const RST={obs:['観測','?'],ok:['確定','✓'],no:['否定','✕']},RKN={tell:'テル',leak:'リーク'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- state ---------- */
function newSes(n=9){return {name:'',level:'',sb:500,bb:1000,ante:1000,n,btn:0,seats:Array.from({length:n},(_,i)=>i?{pid:null,stack:null}:{hero:true,stack:null}),avg:null,pay:{rows:[],left:null,itm:null,entries:null}}}
let S=LS.get('assist.v1',null);
if(!S||!S.ses||!S.players)S={players:{},ses:newSes(),tags:[]};
if(!Array.isArray(S.tags))S.tags=[];
const ui={tab:'table',unit:LS.get('assist.unit','bb'),sel:null,sheet:null,pid:null,seat:null,pk:null,hd:{cards:['',''],pos:'',line:''},cat:'',spot:{v:null,A:null,D:null,I:0},q:'',rk:'tell',rg:LS.get('assist.rgsel',{kind:'open',pos:'UTG',vs:'BB',bb:30}),redit:false,brush:{a:'r',p:100},rhand:null,rimp:'r'};
/* ---------- ranges (kept only in this browser) ---------- */
const RPOS=['UTG','LJ','HJ','CO','BTN','SB'],RORD=[...RPOS,'BB'],RBB=[10,15,20,30,40,50,60,80];
const RCOL={r:'#e4573d',a:'#8e1b2e',c:'#2f9e6b',f:'#e9e9ec'};
const RLAB={open:{r:'オープン',a:'オールイン',c:'リンプ',f:'フォールド'},bb:{r:'3bet',a:'オールイン',c:'コール',f:'フォールド'},v3:{r:'4bet',a:'オールイン',c:'コール',f:'フォールド'}};
let RG=LS.get('assist.ranges',{});if(!RG||typeof RG!=='object')RG={};
// screenshots of charts live in IndexedDB on this device only
const IMG=new Set(),IMGURL={};let idbP=null;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{let r;try{r=indexedDB.open('assist-img',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('img',mode),q=fn(tx.objectStore('img'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}))}
function imgUrl(k){if(IMGURL[k])return Promise.resolve(IMGURL[k]);return idbDo('readonly',st=>st.get(k)).then(b=>b?(IMGURL[k]=URL.createObjectURL(b)):'')}
async function shrink(file){ // keep it readable but small enough to store hundreds
  try{const bmp=await createImageBitmap(file),m=Math.min(1,1500/bmp.width,3600/bmp.height),c=document.createElement('canvas');c.width=Math.round(bmp.width*m);c.height=Math.round(bmp.height*m);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));return b||file}catch(e){return file}
}
idbDo('readonly',st=>st.getAllKeys()).then(ks=>{(ks||[]).forEach(k=>IMG.add(k));if(ui.tab==='range')renderRange()}).catch(()=>{});
function saveRG(){if(!LS.set('assist.ranges',RG))toast('レンジを保存できませんでした')}
function save(){if(!LS.set('assist.v1',S))toast('保存できませんでした（ブラウザの空き容量を確認）')}
const ses=()=>S.ses;
const seatOf=pid=>ses().seats.findIndex(s=>s.pid===pid);
for(const p of Object.values(S.players))if(!Array.isArray(p.reads))p.reads=[];
function newPlayer(){const id=uid();S.players[id]={id,name:'',look:'',gist:'',tags:[],cnt:{},seen:0,notes:[],hands:[],reads:[],created:Date.now(),updated:Date.now()};return S.players[id]}
function touchP(p){p.updated=Date.now();if(ses().name)p.lastName=ses().name;save()}

/* ---------- format ---------- */
const fc=x=>Math.round(x).toLocaleString('en-US');
function nb(x){const v=x/ses().bb;return String(v<10?Math.round(v*100)/100:Math.round(v*10)/10)}
const fb=x=>x==null?'—':(ui.unit==='chips'||!(ses().bb>0)?fc(x):nb(x)+'BB');
const trimNum=v=>String(Math.round(v*100)/100);
const fm=x=>x>=1e8?trimNum(x/1e8)+'億':x>=1e4?trimNum(x/1e4)+'万':fc(x);
const ctext=c=>c?c[0]+SUIT[c[1]]:'?';
function pc(c,cls=''){return c?`<span class="pc ${cls} s-${c[1]}"><b>${c[0]}</b><i>${SUIT[c[1]]}</i></span>`:`<span class="pc ${cls} empty">＋</span>`}
function tm(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function typeCode(p){const t=p.tags.includes('タイト')?'T':p.tags.includes('ルース')?'L':'',a=p.tags.includes('アグレッシブ')?'A':p.tags.includes('パッシブ')?'P':'';
  if(!t&&!a)return '';const code=t&&a?(a==='A'?t+'AG':t+'P'):(t||a);return `<span class="tc ${a==='A'?'agg':a==='P'?'pas':''}">${code}</span>`}
const dname=(p,i)=>p.name||p.look||(i>0?'席'+(i+1):'名前なし');

/* ---------- positions ---------- */
function occSeats(){const o=[];ses().seats.forEach((s,i)=>{if(i===0||s.pid)o.push(i)});return o}
function positions(){
  const occ=occSeats(),m=occ.length,out={};if(m<2)return out;
  let bi=occ.findIndex(i=>i>=ses().btn);if(bi<0)bi=0;
  for(let k=0;k<m;k++)out[occ[(bi+k)%m]]=m===2?(k===0?'SB/BTN':'BB'):POS[m][(k+m-3)%m];
  return out;
}
function btnSeat(){const occ=occSeats();let bi=occ.findIndex(i=>i>=ses().btn);return occ[bi<0?0:bi]}
function nextHand(){
  const occ=occSeats();if(occ.length<2)return toast('プレイヤーを席に座らせてください');
  const bi=occ.indexOf(btnSeat());ses().btn=occ[(bi+1)%occ.length];
  for(const s of ses().seats)if(s.pid&&S.players[s.pid])S.players[s.pid].seen=(S.players[s.pid].seen||0)+1;
  save();render();
}

/* ---------- render ---------- */
function render(){
  for(const t of ['table','icm','range','roster']){$('tb-'+t).classList.toggle('on',ui.tab===t);$('v'+t[0].toUpperCase()+t.slice(1)).hidden=ui.tab!==t}
  const s=ses(),p=s.pay;
  $('seschip').innerHTML=`<span>${esc([s.level,fc(s.sb)+'/'+fc(s.bb)].filter(Boolean).join(' ・ '))}</span><small>${esc([s.name||'大会の設定',p.left?'残り'+fc(p.left)+'人':''].filter(Boolean).join(' ・ '))}</small>`;
  if(ui.tab==='table')renderTable();else if(ui.tab==='icm')renderIcm();else if(ui.tab==='range')renderRange();else renderRoster();
}
function seatXY(i){const n=ses().n,a=Math.PI/2+i*2*Math.PI/n;return [50+40.5*Math.cos(a),50+41.5*Math.sin(a)]}
function renderTable(){
  const s=ses(),pos=positions(),bs=btnSeat();
  const seats=s.seats.map((st,i)=>{
    const [x,y]=seatXY(i),d=i===bs&&pos[i]?'<span class="dealer">D</span>':'';
    if(i===0)return `<button class="seat hero ${ui.sel===0?'sel':''}" style="left:${x}%;top:${y}%" data-a="seat" data-i="0"><span class="pp">${pos[0]||''}${d}</span><span class="nm">Hero</span>${st.stack!=null?`<span class="st num">${fb(st.stack)}</span>`:''}</button>`;
    const p=st.pid&&S.players[st.pid];
    if(!p)return `<button class="seat empty" style="left:${x}%;top:${y}%" data-a="seat" data-i="${i}" aria-label="空席。プレイヤーを座らせる">＋</button>`;
    const nn=p.notes.length+p.hands.length+p.reads.filter(r=>r.st!=='no').length;
    return `<button class="seat ${ui.sel===i?'sel':''}" style="left:${x}%;top:${y}%" data-a="seat" data-i="${i}"><span class="pp">${pos[i]||''}${d}</span><span class="nm">${esc(dname(p,i))}</span><span class="st num">${st.stack!=null?fb(st.stack)+' ':''}${typeCode(p)}</span>${nn?`<span class="badge num">${nn}</span>`:''}</button>`;
  }).join('');
  const seated=s.seats.filter(x=>x.pid).length;
  let html=`<div class="bar"><div class="t">${pos[0]?`あなたは <b>${pos[0]}</b>`:'席をタップしてプレイヤーを登録'}</div><div class="unit" role="group" aria-label="表示単位"><button data-a="unit" data-u="chips" class="${ui.unit==='chips'?'on':''}">点</button><button data-a="unit" data-u="bb" class="${ui.unit==='bb'?'on':''}">BB</button></div><button class="mini navy" data-a="next">次のハンド ▶</button></div>
  <div class="table"><div class="felt"></div><div class="center"><div class="a">${esc(s.level||'TABLE')}</div><div class="b num">${fc(s.sb)} / ${fc(s.bb)}</div><div class="c num">${s.ante?'Ante '+fc(s.ante)+' ・ ':''}${seated+1}人</div></div>${seats}</div>`;
  html+=panelHTML();
  const rows=s.seats.map((st,i)=>{const p=st.pid&&S.players[st.pid];if(!p)return '';
    return `<button class="li" data-a="seat" data-i="${i}"><span class="ps">${pos[i]||''}</span><span class="mid"><span class="a">${esc(dname(p,i))} ${typeCode(p)}</span><span class="b ${p.gist?'g':''}">${esc(p.gist||(liveReads(p)[0]?RKN[liveReads(p)[0].kind]+'（'+RST[liveReads(p)[0].st][0]+'）'+liveReads(p)[0].text:'')||p.tags.join(' ・ ')||(p.notes[0]?p.notes[0].text:'メモなし'))}</span></span><span class="r num">${st.stack!=null?fb(st.stack):''}</span></button>`}).join('');
  html+=`<section class="card"><h2>この卓のプレイヤー<span>${seated}人</span></h2>${rows||'<div class="hint">テーブルの「＋」の席をタップすると、プレイヤーを登録できます。</div>'}</section>`;
  $('vTable').innerHTML=html;
}
function cntCell(p,k,edit){
  const lab=k==='_seen'?'見たハンド':k,c=k==='_seen'?(p.seen||0):(p.cnt[k]||0),sub=PRE.includes(k)&&p.seen?`<small class="num">${c}/${p.seen}</small>`:'';
  const b=`<button class="cnt" data-a="cinc" data-k="${k}">${lab}<b class="num">${c}</b>${sub}</button>`;
  return edit?`<div class="cntrow"><button class="dec" data-a="cdec" data-k="${k}" aria-label="${lab} を1減らす">−</button>${b}</div>`:b;
}
function noteHTML(n,del){return `<div class="nt"><div class="m num">${tm(n.t)}${n.lvl?'<br>'+esc(n.lvl):''}</div><div class="x">${n.cat?`<i>${esc(n.cat)}</i>`:''}${esc(n.text)}</div>${del?`<button class="del" data-a="ndel" data-id="${n.id}" aria-label="このメモを削除">✕</button>`:''}</div>`}
function handHTML(x,del){return `<div class="nt"><div class="m num">${tm(x.t)}${x.lvl?'<br>'+esc(x.lvl):''}</div><div class="x"><span class="cards" style="display:inline-flex;vertical-align:middle;margin-right:6px">${x.cards.map(c=>pc(c,'sm')).join('')}</span>${x.pos?`<i>${esc(x.pos)}</i>`:''}${esc(x.line)}</div>${del?`<button class="del" data-a="hdel" data-id="${x.id}" aria-label="このハンドを削除">✕</button>`:''}</div>`}
const stIcon=st=>`<span class="sti ${st==='obs'?'':st}" title="${RST[st][0]}">${RST[st][1]}</span>`;
function liveReads(p){const o={ok:0,obs:1};return p.reads.filter(r=>r.st!=='no').sort((a,b)=>o[a.st]-o[b.st])}
function readHTML(r){return `<div class="rd ${r.st}"><div class="tx">${stIcon(r.st)}<span><i class="kd ${r.kind}">${RKN[r.kind]}</i>${esc(r.text)}</span></div>
  <div class="meta num">${tm(r.t)}${r.lvl?' ・ '+esc(r.lvl):''} ・ 見た回数 ${r.n||1}</div>
  <div class="ctl"><div class="stseg" role="group" aria-label="状態">${Object.keys(RST).map(k=>`<button class="${r.st===k?'on '+k:''}" data-a="rdst" data-id="${r.id}" data-v="${k}">${RST[k][0]}</button>`).join('')}</div><button class="mini" data-a="rdinc" data-id="${r.id}">また見た ＋1</button><button class="del" data-a="rddel" data-id="${r.id}" aria-label="削除" style="margin-left:auto">✕</button></div></div>`}
function panelHTML(){
  const i=ui.sel,s=ses();if(i==null)return '';
  if(i===0)return `<section class="card"><h2>Hero<span>自分のスタック</span></h2>${stackRow(0,'')}</section>`;
  const p=s.seats[i]&&s.seats[i].pid&&S.players[s.seats[i].pid];if(!p)return '';
  const pos=positions()[i]||'';
  return `<section class="card" id="panel"><div class="phead"><div class="w"><div class="pname">${esc(dname(p,i))} ${typeCode(p)}</div><div class="psub">${[pos,p.name&&p.look?esc(p.look):'',s.seats[i].stack!=null?fb(s.seats[i].stack):''].filter(Boolean).join(' ・ ')}</div></div><button class="mini blue" data-a="detail" data-pid="${p.id}">詳細・編集</button></div>
  ${p.gist?`<div class="gist">${esc(p.gist)}</div>`:''}
  ${liveReads(p).map(r=>`<div class="rdp">${stIcon(r.st)}<span><i class="kd ${r.kind}">${RKN[r.kind]}</i>${esc(r.text)}</span></div>`).join('')}
  ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  <div class="cnts">${CNT.map(k=>cntCell(p,k)).join('')}</div>
  <div class="qnote"><input id="qn" placeholder="気になった動向をメモ" autocomplete="off" aria-label="メモを追加" enterkeyhint="done"><button class="btn pri" data-a="qadd" style="flex:none">追加</button></div>
  ${p.notes.slice(0,3).map(n=>noteHTML(n)).join('')}${p.hands.slice(0,2).map(x=>handHTML(x)).join('')}
  ${p.notes.length>3||p.hands.length>2?`<button class="mini" data-a="detail" data-pid="${p.id}" style="margin-top:6px">すべて見る（メモ${p.notes.length}・ハンド${p.hands.length}）</button>`:''}</section>`;
}
function stackRow(i,label){
  const st=ses().seats[i].stack;
  return `<div class="stkrow"><div class="who">${label||'<span>Hero</span>'}</div><label class="inl"><input class="num" type="number" inputmode="numeric" min="0" data-stk="${i}" data-u="chips" value="${st??''}" placeholder="点数" aria-label="スタック（点数）"><span>点</span></label><label class="inl"><input class="num" type="number" inputmode="decimal" min="0" step="any" data-stk="${i}" data-u="bb" value="${st!=null&&ses().bb?nb(st):''}" placeholder="BB" aria-label="スタック（BB）"><span>BB</span></label></div>`;
}

/* ---------- roster ---------- */
function renderRoster(){
  if(!$('rq'))$('vRoster').innerHTML=`<input id="rq" type="search" placeholder="名前・特徴・メモで検索" aria-label="名簿を検索"><section class="card" id="rlist"></section><section class="card"><h2>バックアップ<span>機種変更やデータ消去に備える</span></h2><div class="row"><button class="btn" data-a="bk-copy">データをコピー</button><button class="btn" data-a="bk-open">貼り付けて復元</button></div><p class="fine">記録はこのブラウザの中だけに保存されます。コピーしたデータをメモ帳などに貼って保管できます。</p></section>`;
  const q=ui.q.toLowerCase();
  const list=Object.values(S.players).filter(p=>!q||JSON.stringify([p.name,p.look,p.gist,p.tags,p.notes.map(n=>n.text),p.reads.map(r=>r.text),p.lastName]).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
  $('rlist').innerHTML=`<h2>プレイヤー名簿<span>${list.length}人</span></h2>`+(list.map(p=>{const i=seatOf(p.id);

function payRows(){return ses().pay.rows.filter(r=>r.from>=1&&r.amt!=null).map(r=>({from:r.from,to:Math.max(r.to||r.from,r.from),amt:r.amt})).sort((a,b)=>a.from-b.from)}
function payInfo(){
  const p=ses().pay,rows=payRows(),o={rows};o.itm=p.itm||(rows.length?rows[rows.length-1].to:null);

  if(p.left&&o.itm){
    if(p.left>o.itm)o.bubble=p.left-o.itm;

}
function payLines(){
  const p=ses().pay,o=payInfo(),L=[],a=[];
  if(p.left)L.push(`残り ${fc(p.left)}${p.entries?'/'+fc(p.entries):''}人${o.itm?`（ITM ${fc(o.itm)}人）`:''}`);
  else if(p.entries||o.itm)L.push([p.entries?`エントリー ${fc(p.entries)}人`:'',o.itm?`ITM ${fc(o.itm)}人`:''].filter(Boolean).join(' / '));
  if(o.bubble)a.push(`バブルまであと${o.bubble}人`);
  if(o.cur!=null)a.push(`現在 ${fm(o.cur)}`+(o.next?` → 次 ${fm(o.next.amt)}（${o.next.at}位・あと${o.next.need}人）`:''));
  if(o.bubble&&o.min!=null)a.push(`最低 ${fm(o.min)}`);
  if(o.first!=null)a.push(`1位 ${fm(o.first)}`);
  if(a.length)L.push('賞金 '+a.join(' / '));

}
function parsePay(text){
  const rows=[];
  for(let line of String(text).split(/\n/)){
    line=line.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，]/g,'').replace(/[¥￥$]/g,' ').replace(/(位|st|nd|rd|th)/gi,'$1 ');
    const m=line.match(/(\d{1,5})\s*(?:位|st|nd|rd|th)?\s*(?:[-‐–—~〜～]\s*(\d{1,5})\s*(?:位|st|nd|rd|th)?)?[\s:：.]+(\d+(?:\.\d+)?)\s*(億|万|k|m)?/i);
    if(!m)continue;let amt=parseFloat(m[3]);const u=(m[4]||'').toLowerCase();
    amt*=u==='万'?1e4:u==='億'?1e8:u==='k'?1e3:u==='m'?1e6:1;
    const from=+m[1],to=m[2]?+m[2]:from;if(from<1||to<from||!(amt>=0))continue;
    rows.push({from,to:to===from?null:to,amt:Math.round(amt)});
  }

}

/* ---------- ICM engine ---------- */
function payArray(n){const a=new Float64Array(n+2);for(const r of payRows())for(let k=r.from;k<=Math.min(r.to,n+1);k++)a[k]=r.amt;return a}
function popc(x){x=x-((x>>1)&0x55555555);x=(x&0x33333333)+((x>>2)&0x33333333);return(((x+(x>>4))&0x0f0f0f0f)*0x01010101)>>>24}
function icmExact(st,pay,n){ // hero is index 0; players with stack 0 are out (they take the lowest remaining places)
  if(!(st[0]>0))return pay[n];
  const s=[];for(let i=0;i<st.length;i++)if(st[i]>0)s.push(st[i]);
  const m=s.length,full=(1<<m)-1,memo=new Float64Array(1<<m).fill(-1),tot=new Float64Array(1<<m);
  for(let mask=1;mask<=full;mask++){const lb=mask&-mask;tot[mask]=tot[mask^lb]+s[31-Math.clz32(lb)]}
  const f=mask=>{if(memo[mask]>=0)return memo[mask];const k=m-popc(mask)+1,t=tot[mask];let ev=s[0]/t*pay[k];
    for(let i=1;i<m;i++)if(mask>>i&1)ev+=s[i]/t*f(mask^(1<<i));return memo[mask]=ev};
  return f(full);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function icmMC(st,pay,scen,seed=20261125){
  // Simulates the finishing order of everyone except Hero (shared across scenarios), then works out Hero's
  // chance of each place exactly for that order. Much steadier than simulating Hero as well.
  const n=st.length,N=Math.max(4000,Math.min(40000,Math.floor(4e6/n))),sum=new Float64Array(scen.length);
  let K=0;for(let k=1;k<=n;k++)if(pay[k]>0)K=k;
  const rnd=mulberry32(seed),base=new Float64Array(n),raw=new Float64Array(n),sorted=new Float64Array(n-1),m=n-1;
  for(let t=0;t<N;t++){
    for(let j=1;j<n;j++){const e=-Math.log(1-rnd());raw[j]=e;base[j]=e/st[j];sorted[j-1]=base[j]}
    sorted.sort();
    for(let q=0;q<scen.length;q++){
      const sc=scen[q],h=sc.h;if(!(h>0)){sum[q]+=pay[n];continue}
      const v=sc.v,old=v>0?base[v]:-1,nk=v>0&&sc.vs>0?raw[v]/sc.vs:Infinity;
      let i=0,skipped=!(v>0),usedNk=!(v>0),prev=1,ev=0;
      for(let k=1;k<=K;k++){
        if(!skipped&&i<m&&sorted[i]===old){i++;skipped=true}
        const cand=i<m?sorted[i]:Infinity;let tk;
        if(!usedNk&&nk<=cand){tk=nk;usedNk=true}else{tk=cand;i++}
        if(tk===Infinity){ev+=pay[k]*prev;prev=0;break}
        const e=Math.exp(-h*tk);ev+=pay[k]*(prev-e);prev=e;if(prev<1e-13)break;
      }
      sum[q]+=ev;
    }

}
function icmEval(st,pay,scen){
  const n=st.length;
  if(n<=13)return {exact:true,ev:scen.map(sc=>{const a=st.slice();a[0]=Math.max(0,sc.h);if(sc.v>0)a[sc.v]=Math.max(0,sc.vs);return icmExact(a,pay,n)})};
  return {exact:false,ev:icmMC(st,pay,scen)};
}
function icmCompute(){
  const s=ses(),p=s.pay,rows=payRows(),H=s.seats[0].stack,n=p.left;
  const opp=[];s.seats.forEach((x,i)=>{if(i>0&&x.pid&&x.stack>0)opp.push({seat:i,stack:x.stack})});
  const need=[['賞金表を入力する',rows.length>0],['残り人数を入力する',n>1],['自分のスタックを入力する',H>0],['相手のスタックを1人以上入力する',opp.length>0]];
  if(need.some(x=>!x[1]))return {need};
  if(n>3000)return {err:'残り人数が多すぎます（3,000人まで）。'};
  if(opp.length+1>n)return {err:'残り人数が、スタックを入力した人数より少なくなっています。'};
  const unknown=n-1-opp.length,known=H+opp.reduce((a,x)=>a+x.stack,0);let rest=null,note='';
  if(unknown>0){
    if(s.avg>0){rest=(s.avg*n-known)/unknown;if(!(rest>0)){rest=null;note='アベレージと入力済みスタックが合わないため、'}}
    if(rest==null){rest=known/(opp.length+1);note+='他のプレイヤーは、入力済みスタックの平均と仮定しています。'}
    else note='スタック未入力の'+fc(unknown)+'人は、残りチップを均等に持つと仮定しています（1人 '+fb(rest)+'）。';
  }

  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset,s=ses();
  switch(a){
    case 'tab':ui.tab=d.t;render();$('main').scrollTop=0;break;
    case 'close':closeSheet();break;
    case 'ses':openSheet('ses');break;
    case 'unit':if(ui.unit!==d.u){ui.unit=d.u;LS.set('assist.unit',ui.unit);render()}break;
    case 'next':nextHand();break;
    case 'seat':{const i=+d.i;if(i>0&&!s.seats[i].pid){ui.seat=i;ui.aq='';openSheet('assign');break}ui.sel=ui.sel===i&&el.classList.contains('seat')?null:i;if(ui.tab!=='table')ui.tab='table';render();if(el.classList.contains('li'))$('main').scrollTop=0;break}
    case 'newp':{const p=newPlayer();s.seats[ui.seat].pid=p.id;s.seats[ui.seat].stack=null;ui.sel=ui.seat;touchP(p);ui.pid=p.id;ui.hd={cards:['',''],pos:'',line:''};openSheet('player');break}
    case 'sitp':{s.seats[ui.seat].pid=d.pid;s.seats[ui.seat].stack=null;ui.sel=ui.seat;touchP(S.players[d.pid]);closeSheet();break}
    case 'sit':{const i=+d.i;s.seats[i].pid=ui.pid;s.seats[i].stack=null;ui.sel=i;touchP(S.players[ui.pid]);renderSheet();toast('席'+(i+1)+'に座らせました');break}
    case 'detail':ui.pid=d.pid;ui.hd={cards:['',''],pos:'',line:''};ui.cat='';openSheet('player');break;
    case 'unseat':{const i=seatOf(ui.pid);if(i>0){s.seats[i]={pid:null,stack:null};if(ui.sel===i)ui.sel=null;save()}closeSheet();toast('席を空けました。記録は名簿に残っています');break}
    case 'pdel':{if(!await ask('このプレイヤーの記録をすべて削除しますか？元に戻せません。','削除'))break;const i=seatOf(ui.pid);if(i>0)s.seats[i]={pid:null,stack:null};delete S.players[ui.pid];if(ui.sel===i)ui.sel=null;save();closeSheet();break}
    case 'tag':{const p=S.players[ui.pid],t=d.t;p.tags=p.tags.includes(t)?p.tags.filter(x=>x!==t):[...p.tags,t];touchP(p);el.classList.toggle('on');break}
    case 'tagadd':{const t=$('newTag').value.trim();if(!t)break;if(!TAGS.includes(t)&&!S.tags.includes(t))S.tags.push(t);const p=S.players[ui.pid];if(!p.tags.includes(t))p.tags.push(t);touchP(p);renderSheet();break}
    case 'cinc':case 'cdec':{const p=curP();if(!p)break;const k=d.k,dv=a==='cinc'?1:-1;if(k==='_seen')p.seen=Math.max(0,(p.seen||0)+dv);else p.cnt[k]=Math.max(0,(p.cnt[k]||0)+dv);touchP(p);refresh();break}
    case 'qadd':{const p=curP(),i=$('qn');if(p&&addNote(p,i.value,''))render();else if(i)i.focus();break}
    case 'rk':ui.rk=d.v;document.querySelectorAll('[data-a="rk"]').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.rk));break;
    case 'rdadd':{const p=S.players[ui.pid],i=$('rdText'),t=i.value.trim();if(!t){i.focus();break}p.reads.unshift({id:uid(),kind:ui.rk,text:t,st:'obs',n:1,t:Date.now(),lvl:s.level||''});touchP(p);renderSheet();break}
    case 'rdst':{const p=S.players[ui.pid],r=p.reads.find(x=>x.id===d.id);if(r){r.st=d.v;touchP(p);renderSheet()}break}
    case 'rdinc':{const p=S.players[ui.pid],r=p.reads.find(x=>x.id===d.id);if(r){r.n=(r.n||1)+1;touchP(p);renderSheet()}break}
    case 'rddel':{const p=S.players[ui.pid];p.reads=p.reads.filter(x=>x.id!==d.id);touchP(p);renderSheet();break}
    case 'cat':ui.cat=ui.cat===d.c?'':d.c;document.querySelectorAll('[data-a="cat"]').forEach(b=>b.classList.toggle('on',b.dataset.c===ui.cat));break;
    case 'nadd':{const p=S.players[ui.pid],i=$('nText');if(addNote(p,i.value,ui.cat)){ui.cat='';renderSheet()}else i.focus();break}
    case 'ndel':{const p=S.players[ui.pid];p.notes=p.notes.filter(n=>n.id!==d.id);touchP(p);renderSheet();break}
    case 'hcard':ui.hd.line=$('hLine').value;ui.hd.pos=$('hPos').value;ui.pk={i:ui.hd.cards[0]&&!ui.hd.cards[1]?1:+d.i};ui.sheet='pick';renderSheet();$('sheet').scrollTop=0;break;
    case 'slot':ui.pk.i=+d.j;renderSheet();break;
    case 'card':{ui.hd.cards[ui.pk.i]=d.c;const nx=ui.hd.cards.findIndex(c=>!c);if(nx>=0){ui.pk.i=nx;renderSheet()}else{ui.sheet='player';renderSheet();const h=$('hLine');if(h)h.scrollIntoView({block:'center'})}break}
    case 'pk-back':ui.sheet='player';renderSheet();break;
    case 'hadd':{const p=S.players[ui.pid],line=$('hLine').value.trim(),pos=$('hPos').value;if(!ui.hd.cards.some(Boolean)&&!line){toast('カードか流れを入力してください');break}p.hands.unshift({id:uid(),t:Date.now(),lvl:s.level||'',cards:[...ui.hd.cards],pos,line});p.cnt['SD到達']=(p.cnt['SD到達']||0)+1;ui.hd={cards:['',''],pos:'',line:''};touchP(p);renderSheet();break}
    case 'hdel':{const p=S.players[ui.pid];p.hands=p.hands.filter(x=>x.id!==d.id);touchP(p);renderSheet();break}
    case 'setn':{const n=+d.n;if(n===s.n)break;const lost=s.seats.slice(n).some(x=>x.pid);if(lost&&!await ask('席を減らすと、あふれた席のプレイヤーは席から外れます（記録は名簿に残ります）。よろしいですか？','減らす'))break;
      while(s.seats.length<n)s.seats.push({pid:null,stack:null});s.seats.length=n;s.n=n;if(s.btn>=n)s.btn=0;if(ui.sel>=n)ui.sel=null;save();renderSheet();break}
    case 'pay-add':{const r=s.pay.rows,l=r[r.length-1];r.push({from:l&&l.from?(l.to||l.from)+1:1,to:null,amt:null});save();renderSheet();const i=document.querySelector(`[data-pr="${r.length-1}"][data-k="amt"]`);if(i)i.focus();break}
    case 'pay-del':s.pay.rows.splice(+d.i,1);save();renderSheet();break;
    case 'pay-imp':{const rows=parsePay($('payPaste').value);if(!rows.length){toast('読み取れる行がありません（例：1位 3,000,000）');break}if(s.pay.rows.length&&!await ask(`今の賞金表を、読み取った${rows.length}行で置き換えますか？`,'置き換える'))break;s.pay.rows=rows;save();renderSheet();toast(rows.length+'行を取り込みました');break}
    case 'pay-log':{const c=LS.get('mtt.ctx',null);if(!c||!c.pay)break;if(s.pay.rows.length&&!await ask('今の賞金表を、MTT LOGの賞金表で置き換えますか？','置き換える'))break;s.pay=JSON.parse(JSON.stringify(c.pay));if(!s.avg&&c.avg)s.avg=c.avg;save();renderSheet();toast('MTT LOGから取り込みました');break}
    case 'retable':{if(!await ask('すべての席を空にしますか？プレイヤーの記録は名簿に残ります。','空にする'))break;s.seats.forEach((x,i)=>{if(i>0){x.pid=null;x.stack=null}});s.btn=0;ui.sel=null;save();closeSheet();break}
    case 'newses':{if(!await ask('新しい大会を始めますか？席・賞金表・人数をリセットします。プレイヤーの記録は名簿に残ります。','新しい大会'))break;const o=s;S.ses=newSes(o.n);S.ses.sb=o.sb;S.ses.bb=o.bb;S.ses.ante=o.ante;ui.sel=null;ui.spot={v:null,A:null,D:null,I:0};save();renderSheet();toast('新しい大会を始めました');break}
    case 'left-1':if(s.pay.left>2){s.pay.left--;save();render()}break;
    case 'sp-def':spotDefaults();renderIcm();break;
    case 'bk-copy':{const t=JSON.stringify(S);let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(err){}toast(ok?'コピーしました。メモ帳などに貼って保管してください':'コピーできませんでした');break}
    case 'bk-open':openSheet('bk');break;
    case 'bk-restore':{let j=null;try{j=JSON.parse($('bkTa').value)}catch(err){}if(!j||!j.players||!j.ses||!Array.isArray(j.ses.seats)){toast('データの形式が正しくありません');break}if(!await ask('今のデータを、貼り付けた内容で置き換えますか？','置き換える'))break;S=j;if(!Array.isArray(S.tags))S.tags=[];for(const p of Object.values(S.players))if(!Array.isArray(p.reads))p.reads=[];ui.sel=null;save();closeSheet();toast('復元しました');break}
    case 'rkind':ui.rg.kind=d.v;ui.rhand=null;LS.set('assist.rgsel',ui.rg);renderRange();break;
    case 'rpos':ui.rg.pos=d.v;ui.rhand=null;LS.set('assist.rgsel',ui.rg);renderRange();break;
    case 'rvs':ui.rg.vs=d.v;ui.rhand=null;LS.set('assist.rgsel',ui.rg);renderRange();break;
    case 'rbb':ui.rg.bb=+d.v;LS.set('assist.rgsel',ui.rg);renderRange();break;
    case 'redit':ui.redit=!ui.redit;renderRange();break;
    case 'rbrush':ui.brush.a=d.v;renderRange();break;
    case 'rpct':ui.brush.p=+d.v;renderRange();break;
    case 'rcell':{const i=+d.h,y=$('main').scrollTop;if(ui.redit)paint(i);ui.rhand=i;renderRange();$('main').scrollTop=y;break}
    case 'rclear':{if(!await ask('このチャートを消去しますか？','消去'))break;delete RG[rkey()];saveRG();renderRange();break}
    case 'rimp-open':openSheet('rimp');break;
    case 'rimg-pick':ui.imgKey=rkey();$('rimgIn').click();break;
    case 'rimg-multi':ui.imgBase={...ui.rg};$('rimgMulti').click();break;
    case 'rimg-del':{if(!await ask('このスクリーンショットを削除しますか？','削除'))break;const k=rkey();try{await idbDo('readwrite',st=>st.delete(k))}catch(err){}IMG.delete(k);if(IMGURL[k]){URL.revokeObjectURL(IMGURL[k]);delete IMGURL[k]}renderRange();break}
    case 'rzoom':{const u=IMGURL[rkey()];if(!u)break;$('vimg').src=u;$('vscroll').classList.remove('z');$('vzoomBtn').textContent='拡大';$('viewer').hidden=false;break}
    case 'vzoom':{const z=$('vscroll').classList.toggle('z');$('vzoomBtn').textContent=z?'全体表示':'拡大';break}
    case 'vclose':$('viewer').hidden=true;break;
    case 'rimp-act':ui.rimp=d.v;document.querySelectorAll('[data-a="rimp-act"]').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.rimp));break;
    case 'rimp-go':{const map=parseRange($('rimpTa').value),n=Object.keys(map).length;if(!n){toast('読み取れるハンドがありません（例：AA,KK,AKs:0.5）');break}applyRange(map,ui.rimp);closeSheet();toast(n+'ハンドを取り込みました');break}
    case 'rfile':$('rfileIn').click();break;
    case 'rcopy':{let ok=false;try{await navigator.clipboard.writeText(JSON.stringify({v:1,charts:RG}));ok=true}catch(err){}toast(ok?'レンジの全データをコピーしました':'コピーできませんでした');break}
    case 'modal-ok':endModal(true);break;
    case 'modal-no':endModal(false);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,s=ses(),num=()=>{const v=parseFloat(t.value);return isFinite(v)&&v>=0?v:null};
  if(t.dataset.stk!=null){const i=+t.dataset.stk,v=num(),bbm=t.dataset.u==='bb';s.seats[i].stack=v==null?null:Math.round(bbm?v*s.bb:v);save();
    const o=t.closest('.stkrow').querySelector(`[data-u="${bbm?'chips':'bb'}"]`);if(o)o.value=v==null?'':(bbm?Math.round(v*s.bb):nb(v));if(ui.tab==='icm'&&!ui.sheet)scheduleIcm()}
  else if(t.id==='pName'||t.id==='pLook'||t.id==='pGist'){const p=S.players[ui.pid];p[{pName:'name',pLook:'look',pGist:'gist'}[t.id]]=t.value;touchP(p)}
  else if(t.id==='rq'){ui.q=t.value;renderRoster()}
  else if(t.id==='aq'){ui.aq=t.value;const tmp=document.createElement('div');tmp.innerHTML=assignHTML();$('alist').innerHTML=tmp.querySelector('#alist').innerHTML}
  else if(t.id==='sName'){s.name=t.value;save()}
  else if(t.id==='sLevel'){s.level=t.value;save()}
  else if(t.id==='sSb'||t.id==='sAnte'){s[t.id==='sSb'?'sb':'ante']=Math.round(num()||0);save()}
  else if(t.id==='sBb'){const v=num();if(v>0){s.bb=Math.round(v);save()}}
  else if(t.id==='sAvg'||t.id==='sAvgBb'){const v=num(),bbm=t.id==='sAvgBb';s.avg=v==null?null:Math.round(bbm?v*s.bb:v);save();const o=$(bbm?'sAvg':'sAvgBb');if(o)o.value=s.avg==null?'':(bbm?s.avg:nb(s.avg))}
  else if(t.dataset.pr!=null){const r=s.pay.rows[+t.dataset.pr],v=num();if(!r)return;r[t.dataset.k]=v==null?null:Math.round(v);save();if(t.dataset.k==='amt')$('payh'+t.dataset.pr).textContent=r.amt?fm(r.amt):'';updPaySum()}
  else if(t.id==='pLeft'||t.id==='pItm'||t.id==='pEnt'){const v=parseInt(t.value,10);s.pay[{pLeft:'left',pItm:'itm',pEnt:'entries'}[t.id]]=v>0?v:null;save();updPaySum()}
  else if(t.id==='spA'||t.id==='spD'||t.id==='spI'){const v=num();ui.spot[t.id[2]]=v==null?null:(ui.unit==='bb'?v*s.bb:v);scheduleIcm()}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='rimgMulti'){const fs=[...(t.files||[])],g=ui.imgBase;t.value='';if(!fs.length||!g)return;
    const named=new Set(fs.map(f=>f.name)).size===fs.length;if(named)fs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    let n=0;for(const f of fs.slice(0,RBB.length)){const k=rkey({...g,bb:RBB[n]});try{const b=await shrink(f);await idbDo('readwrite',st=>st.put(b,k));IMG.add(k);if(IMGURL[k])URL.revokeObjectURL(IMGURL[k]);IMGURL[k]=URL.createObjectURL(b);n++}catch(err){break}}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    toast(n?`${n}枚を ${RBB[0]}BB から順に登録しました`:'画像を保存できませんでした');if(ui.tab==='range')renderRange();return}
  if(t.id==='rimgIn'){const f=t.files&&t.files[0],k=ui.imgKey;t.value='';if(!f||!k)return;
    try{const b=await shrink(f);await idbDo('readwrite',st=>st.put(b,k));IMG.add(k);if(IMGURL[k])URL.revokeObjectURL(IMGURL[k]);IMGURL[k]=URL.createObjectURL(b);if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});toast('スクリーンショットを登録しました')}
    catch(err){toast('画像を保存できませんでした')}
    if(ui.tab==='range')renderRange();return}
  if(t.id==='rfileIn'){const f=t.files&&t.files[0];if(!f)return;let j=null;try{j=JSON.parse(await f.text())}catch(err){}const n=mergeRanges(j);t.value='';if(n<=0)toast('レンジのデータとして読み取れませんでした');else{toast(n+'枚のチャートを取り込みました');renderRange()}}else if(t.id==='spV'){ui.spot.v=+t.value;spotDefaults();renderIcm()}else if(t.id==='hPos')ui.hd.pos=t.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const m={qn:'qadd',nText:'nadd',hLine:'hadd',newTag:'tagadd',rdText:'rdadd'}[e.target.id];if(m){e.preventDefault();document.querySelector(`[data-a="${m}"]`).click()}}
  if(e.key==='Escape'){if(!$('viewer').hidden)$('viewer').hidden=true;else if(!$('modal').hidden)endModal(false);else if(ui.sheet)closeSheet()}
});
render();
</script>
</body>
